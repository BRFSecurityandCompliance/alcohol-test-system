<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>แดชบอร์ด — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 200px; padding: 16px 0; }
  .bar { flex: 1; background: linear-gradient(180deg, var(--brand-2), var(--brand)); border-radius: 6px 6px 0 0; min-height: 4px; position: relative; cursor: pointer; transition: opacity .15s; }
  .bar:hover { opacity: .8; }
  .bar .lbl { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .bar .val { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; }
  .latest-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .latest-row:last-child { border-bottom: none; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:24px">
    <div>
      <h1>แดชบอร์ด</h1>
      <div class="muted small">ภาพรวมข้อมูลการตรวจแอลกอฮอล์</div>
    </div>
    <div class="muted small" id="now"></div>
  </div>

  <div class="stats" style="margin-bottom:24px" id="stats"></div>

  <div style="display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-bottom:24px">
    <div class="card">
      <div class="card-header">
        <h2>ผลตรวจ 7 วันล่าสุด</h2>
        <span class="badge badge-brand">รายวัน</span>
      </div>
      <div class="chart" id="chart"></div>
      <div style="margin-top:32px"></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>สัดส่วนผล</h2></div>
      <div id="ratio"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>ผลตรวจล่าสุด</h2>
      <a href="admin-tests.html" class="btn btn-sm">ดูทั้งหมด →</a>
    </div>
    <div id="latest"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
if (!requireAdmin()) {} else {
  document.getElementById('chrome').innerHTML = renderTopbar('dashboard');
  document.getElementById('now').textContent = new Date().toLocaleDateString('th-TH', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

  const tests = DB.tests();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayCount = tests.filter(t => new Date(t.created_at) >= today).length;
  const zero = tests.filter(t => t.is_zero).length;
  const positive = tests.filter(t => !t.is_zero).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat accent-blue"><div class="label">ทั้งหมด</div><div class="value">${tests.length}</div><div class="delta">รวมทุกสถานที่</div></div>
    <div class="stat accent-green"><div class="label">ผลเป็น 0%</div><div class="value">${zero}</div><div class="delta">${tests.length ? Math.round(zero/tests.length*100) : 0}% ของทั้งหมด</div></div>
    <div class="stat accent-red"><div class="label">ตรวจพบแอลกอฮอล์</div><div class="value">${positive}</div><div class="delta">${tests.length ? Math.round(positive/tests.length*100) : 0}% ของทั้งหมด</div></div>
    <div class="stat"><div class="label">วันนี้</div><div class="value">${todayCount}</div><div class="delta">${new Date().toLocaleDateString('th-TH')}</div></div>
  `;

  // 7-day chart
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
    const next = new Date(d); next.setDate(next.getDate() + 1);
    days.push({
      label: d.toLocaleDateString('th-TH', {weekday:'short'}),
      count: tests.filter(t => { const td = new Date(t.created_at); return td >= d && td < next; }).length
    });
  }
  const max = Math.max(...days.map(d => d.count), 1);
  document.getElementById('chart').innerHTML = days.map(d => `
    <div class="bar" style="height:${(d.count/max)*100}%">
      <span class="val">${d.count}</span>
      <span class="lbl">${d.label}</span>
    </div>
  `).join('');

  // Ratio
  const total = tests.length || 1;
  document.getElementById('ratio').innerHTML = `
    <div style="margin-bottom:16px">
      <div class="row between" style="margin-bottom:6px"><span class="small">ไม่พบแอลกอฮอล์</span><span class="small" style="font-weight:600;color:var(--success)">${zero}</span></div>
      <div style="height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden"><div style="height:100%; width:${zero/total*100}%; background:var(--success)"></div></div>
    </div>
    <div>
      <div class="row between" style="margin-bottom:6px"><span class="small">ตรวจพบแอลกอฮอล์</span><span class="small" style="font-weight:600;color:var(--danger)">${positive}</span></div>
      <div style="height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden"><div style="height:100%; width:${positive/total*100}%; background:var(--danger)"></div></div>
    </div>
    <div class="divider"></div>
    <div class="small muted">การตรวจที่พบแอลกอฮอล์ควรได้รับการตรวจสอบเพิ่มเติม และดำเนินการตามขั้นตอนความปลอดภัย</div>
  `;

  // Latest 6
  const latest = tests.slice(0, 6);
  document.getElementById('latest').innerHTML = latest.length ? latest.map(t => `
    <div class="latest-row">
      <div class="avatar">${t.full_name.charAt(0)}</div>
      <div class="grow">
        <div style="font-weight:600">${t.full_name}</div>
        <div class="tiny muted">${t.department} · ${t.location_name} · ${formatDate(t.created_at)}</div>
      </div>
      ${t.is_zero
        ? '<span class="badge badge-success"><span class="badge-dot"></span>0%</span>'
        : `<span class="badge badge-danger"><span class="badge-dot"></span>${t.alcohol_value} mg%</span>`}
    </div>
  `).join('') : '<div class="empty"><div class="icon">📋</div>ยังไม่มีข้อมูล</div>';
}
</script>
</body>
</html>
