<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<script>(function(){if(!/\.github\.io$/i.test(location.hostname))return;var f=(location.pathname.match(/\/project\/(.*)$/)||["",""])[1];location.replace("https://alcohol-test-system.securitycompliance.workers.dev/"+f+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>แดชบอร์ด — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="alternate icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
<style>
  .chart { display:flex; align-items:flex-end; gap:8px; height:180px; padding:16px 0 0; }
  .bar { flex:1; background:linear-gradient(180deg, var(--brand-2), var(--brand)); border-radius:6px 6px 0 0; min-height:4px; position:relative; cursor:pointer; transition:opacity .15s; }
  .bar.fail { background:linear-gradient(180deg, #f87171, var(--danger)); }
  .bar:hover { opacity:.8; }
  .bar .lbl { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .bar .val { position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:600; }
  .chart-legend { display:flex; gap:16px; margin-top:32px; font-size:12px; color:var(--text-muted); }
  .chart-legend span { display:flex; align-items:center; gap:6px; }
  .legend-dot { width:10px; height:10px; border-radius:2px; }
  .latest-row { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
  .latest-row:last-child { border-bottom:none; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-weight:700; flex-shrink:0; }
  .avatar.red { background:var(--danger-soft); color:var(--danger); }
  /* Heatmap */
  .hm-grid { display:grid; gap:3px; overflow-x:auto; }
  .hm-row { display:grid; gap:3px; align-items:center; }
  .hm-cell { width:22px; height:22px; border-radius:3px; background:var(--surface-2); cursor:default; position:relative; }
  .hm-cell[data-tip]:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:4px 8px; border-radius:4px; font-size:11px; white-space:nowrap; z-index:10; pointer-events:none; }
  .hm-cell[data-v="0"] { background:var(--surface-2); }
  .hm-cell[data-v="1"] { background:oklch(0.88 0.08 25); }
  .hm-cell[data-v="2"] { background:oklch(0.78 0.13 25); }
  .hm-cell[data-v="3"] { background:oklch(0.68 0.18 25); }
  .hm-cell[data-v="4"] { background:oklch(0.52 0.20 25); }
  .hm-day-label { font-size:10px; color:var(--text-muted); text-align:right; padding-right:4px; white-space:nowrap; }
  .rank-bar-wrap { margin-bottom:10px; }
  .rank-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .rank-name { width:160px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-bar-bg { flex:1; height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .rank-bar-fill { height:100%; border-radius:99px; background:var(--danger); transition:width .4s ease; }
  .rank-bar-fill.ok { background:var(--success); }
  .rank-num { font-size:12px; font-weight:600; min-width:36px; text-align:right; }
  .delta-chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .delta-up { background:#dcfce7; color:#166534; }
  .delta-down { background:#fee2e2; color:#7f1d1d; }
  .delta-same { background:var(--surface-2); color:var(--text-muted); }
  @media (max-width: 860px) { .dash-row { grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:24px">
    <div>
      <h1 id="page-title"></h1>
      <div class="muted small" id="page-sub"></div>
    </div>
    <div class="muted small" id="now"></div>
  </div>

  <!-- Period + dimension controls -->
  <div id="period-bar" class="period-bar"></div>
  <div class="muted small" id="range-label" style="margin:-6px 0 16px"></div>

  <div class="stats" style="margin-bottom:16px" id="stats"></div>

  <!-- Row 1: adaptive trend + severity breakdown -->
  <div class="dash-row" style="display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:16px">
    <div class="card">
      <div class="card-header">
        <h2 id="chart-title"></h2>
        <div class="row gap-sm">
          <span class="sev-dot dot-pass"></span><span class="tiny muted" id="legend-pass"></span>
          <span class="sev-dot dot-nodrive"></span><span class="tiny muted" id="legend-fail"></span>
        </div>
      </div>
      <div class="trend" id="chart"></div>
    </div>
    <div class="card">
      <div class="card-header"><h2 id="ratio-title"></h2></div>
      <div id="ratio"></div>
    </div>
  </div>

  <!-- Row 2: shift analysis + retest outcomes -->
  <div class="dash-row" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px">
    <div class="card">
      <div class="card-header"><h2 id="shift-title"></h2></div>
      <div id="shift-analysis"></div>
    </div>
    <div class="card">
      <div class="card-header"><h2 id="retest-title"></h2></div>
      <div id="retest-outcomes"></div>
    </div>
  </div>

  <!-- Row 3: Top sites + Top depts -->
  <div class="dash-row" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px">
    <div class="card">
      <div class="card-header">
        <h2 id="top-sites-title"></h2>
        <a href="admin-reports.html" class="btn btn-sm btn-ghost" id="reports-link"></a>
      </div>
      <div id="top-sites"></div>
    </div>
    <div class="card">
      <div class="card-header"><h2 id="top-depts-title"></h2></div>
      <div id="top-depts"></div>
    </div>
  </div>

  <!-- Row 4: Repeat offenders -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><h2 id="repeat-title"></h2><span class="muted small" id="repeat-sub"></span></div>
    <div id="repeat-offenders"></div>
  </div>

  <!-- Row 5: Heatmap -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-header">
      <h2 id="heatmap-title"></h2>
      <span class="muted small" id="heatmap-sub"></span>
    </div>
    <div id="heatmap" style="overflow-x:auto; padding-bottom:4px"></div>
    <div class="row gap-md" style="margin-top:12px; font-size:11px; color:var(--text-muted); justify-content:flex-end">
      <span id="hm-low"></span>
      <span style="display:flex;gap:3px">
        <span style="width:16px;height:16px;border-radius:2px;background:var(--surface-2);display:inline-block"></span>
        <span style="width:16px;height:16px;border-radius:2px;background:oklch(0.88 0.08 25);display:inline-block"></span>
        <span style="width:16px;height:16px;border-radius:2px;background:oklch(0.78 0.13 25);display:inline-block"></span>
        <span style="width:16px;height:16px;border-radius:2px;background:oklch(0.68 0.18 25);display:inline-block"></span>
        <span style="width:16px;height:16px;border-radius:2px;background:oklch(0.52 0.20 25);display:inline-block"></span>
      </span>
      <span id="hm-high"></span>
    </div>
  </div>

  <!-- Row 6: Latest tests + Pending alerts -->
  <div class="dash-row" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px">
    <div class="card">
      <div class="card-header">
        <h2 id="latest-title"></h2>
        <a href="admin-tests.html" class="btn btn-sm" id="view-all-btn"></a>
      </div>
      <div id="latest"></div>
    </div>
    <div class="card" id="alert-card" style="display:none">
      <div class="card-header">
        <h2 style="color:var(--danger)" id="alert-card-title"></h2>
        <a href="admin-alerts.html" class="btn btn-sm btn-danger" id="alert-view-all-btn"></a>
      </div>
      <div id="pending-alerts"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (requireAdmin()) {
  document.getElementById('chrome').innerHTML = renderTopbar('dashboard');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';
  const loc = isEN ? 'en-GB' : 'th-TH';
  const T = (en, th) => isEN ? en : th;

  // ── Filter state (persisted) ────────────────────────────────────────────────
  const LS_KEY = 'dash_filters';
  const DEFAULTS = { preset: 'month', from: '', to: '', dept: '', company: '', location: '', shift: '', compare: true };
  let filters;
  try { filters = { ...DEFAULTS, ...(JSON.parse(localStorage.getItem(LS_KEY)) || {}) }; } catch { filters = { ...DEFAULTS }; }
  const persist = () => localStorage.setItem(LS_KEY, JSON.stringify(filters));

  const SHIFTS = [['morning', T('Morning','เช้า')], ['afternoon', T('Afternoon','บ่าย')], ['night', T('Night','ดึก')]];
  const SEV = [
    ['pass',     T('Pass','ผ่าน'),        'pass'],
    ['caution',  T('Caution','เตือน'),    'caution'],
    ['no-drive', T('No-drive','ห้ามขับ'), 'nodrive'],
    ['illegal',  T('Illegal','ผิดกฎหมาย'),'illegal'],
  ];
  const fmtDay = (d) => d.toLocaleDateString(loc, { day: '2-digit', month: 'short', year: 'numeric' });

  // Static labels
  document.getElementById('page-title').textContent = T('Dashboard','แดชบอร์ด');
  document.getElementById('page-sub').textContent = T('Alcohol test data overview','ภาพรวมข้อมูลการตรวจแอลกอฮอล์');
  document.getElementById('now').textContent = new Date().toLocaleDateString(loc, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  document.getElementById('legend-pass').textContent = T('Pass','ผ่าน');
  document.getElementById('legend-fail').textContent = T('Detected','พบ');
  document.getElementById('ratio-title').textContent = T('Severity Breakdown','แยกตามระดับ');
  document.getElementById('shift-title').textContent = T('Detection Rate by Shift','อัตราพบตามกะ');
  document.getElementById('retest-title').textContent = T('Retest Outcomes','ผลการตรวจซ้ำ');
  document.getElementById('top-sites-title').textContent = T('Top 5 Locations (% Detected)','Top 5 สถานที่ (% พบ)');
  document.getElementById('reports-link').textContent = T('Reports →','รายงาน →');
  document.getElementById('top-depts-title').textContent = T('Top 5 Departments (% Detected)','Top 5 แผนก (% พบ)');
  document.getElementById('repeat-title').textContent = T('Repeat Offenders','ผู้ตรวจพบซ้ำ');
  document.getElementById('repeat-sub').textContent = T('≥ 2 detections in period','พบตั้งแต่ 2 ครั้งในช่วงนี้');
  document.getElementById('heatmap-title').textContent = T('Heatmap — Detection by Weekday × Hour','Heatmap — ช่วงเวลาที่พบ ตามวัน × ชั่วโมง');
  document.getElementById('hm-low').textContent = T('Low','น้อย');
  document.getElementById('hm-high').textContent = T('High','มาก');
  document.getElementById('latest-title').textContent = T('Latest Test Results','ผลตรวจล่าสุด');
  document.getElementById('view-all-btn').textContent = T('View all →','ดูทั้งหมด →');
  document.getElementById('alert-card-title').textContent = T('⚠ Pending','⚠ รอดำเนินการ');
  document.getElementById('alert-view-all-btn').textContent = T('View all →','ดูทั้งหมด →');

  // ── Period bar (built once; poll re-renders only the widgets below) ──────────
  function buildPeriodBar() {
    const presets = [['today',T('Today','วันนี้')],['7d',T('7 Days','7 วัน')],['week',T('This Week','สัปดาห์นี้')],['month',T('This Month','เดือนนี้')],['custom',T('Custom','กำหนดเอง')]];
    const opt = (v, label, sel) => `<option value="${esc(v)}"${sel===v?' selected':''}>${esc(label)}</option>`;
    document.getElementById('period-bar').innerHTML = `
      <div class="field"><label>${T('Period','ช่วงเวลา')}</label>
        <div class="seg" id="preset-seg">${presets.map(([k,l])=>`<button class="seg-btn" data-preset="${k}">${l}</button>`).join('')}</div></div>
      <div class="field"><label>${T('From','จาก')}</label><input class="input" type="date" id="pb-from" value="${filters.from}"></div>
      <div class="field"><label>${T('To','ถึง')}</label><input class="input" type="date" id="pb-to" value="${filters.to}"></div>
      <div class="field"><label>${T('Department','แผนก')}</label><select class="select" id="pb-dept"><option value="">${T('All','ทั้งหมด')}</option>${DEPARTMENTS.map(d=>opt(d,d,filters.dept)).join('')}</select></div>
      <div class="field"><label>${T('Company','บริษัท')}</label><select class="select" id="pb-co"><option value="">${T('All','ทั้งหมด')}</option>${DB.companies().map(c=>opt(c.name,c.name,filters.company)).join('')}</select></div>
      <div class="field"><label>${T('Location','สถานที่')}</label><select class="select" id="pb-loc"><option value="">${T('All','ทั้งหมด')}</option>${DB.locations().map(l=>opt(l.code,`${l.name} (${l.code})`,filters.location)).join('')}</select></div>
      <div class="field"><label>${T('Shift','กะ')}</label><select class="select" id="pb-shift"><option value="">${T('All','ทั้งหมด')}</option>${SHIFTS.map(([k,l])=>opt(k,l,filters.shift)).join('')}</select></div>
      <div class="field"><label>&nbsp;</label><label class="row gap-sm" style="cursor:pointer;font-weight:500;white-space:nowrap"><input type="checkbox" id="pb-compare"${filters.compare?' checked':''}> ${T('Compare to previous','เทียบช่วงก่อน')}</label></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-sm" id="pb-reset">${T('Reset','รีเซ็ต')}</button></div>`;

    const seg = () => document.querySelectorAll('#preset-seg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === filters.preset));
    const set = (patch, rebuildSeg) => { Object.assign(filters, patch); persist(); if (rebuildSeg) seg(); renderDashboard(); };
    document.querySelectorAll('#preset-seg .seg-btn').forEach(b => b.onclick = () => set(b.dataset.preset === 'custom' ? { preset: 'custom' } : { preset: b.dataset.preset, from: '', to: '' }, true));
    document.getElementById('pb-from').onchange  = e => set({ from: e.target.value, preset: 'custom' }, true);
    document.getElementById('pb-to').onchange    = e => set({ to: e.target.value, preset: 'custom' }, true);
    document.getElementById('pb-dept').onchange  = e => set({ dept: e.target.value });
    document.getElementById('pb-co').onchange    = e => set({ company: e.target.value });
    document.getElementById('pb-loc').onchange   = e => set({ location: e.target.value });
    document.getElementById('pb-shift').onchange = e => set({ shift: e.target.value });
    document.getElementById('pb-compare').onchange = e => set({ compare: e.target.checked });
    document.getElementById('pb-reset').onclick = () => { filters = { ...DEFAULTS }; persist(); buildPeriodBar(); renderDashboard(); };
    seg();
  }

  // Resolve the active window (+ previous equal-length window for comparison).
  function resolveRange() {
    if (filters.preset === 'custom') {
      const start = filters.from ? new Date(filters.from + 'T00:00:00') : new Date(0);
      const end = filters.to ? new Date(filters.to + 'T23:59:59.999') : new Date();
      const len = end - start;
      const prevEnd = new Date(start.getTime() - 1);
      const prevStart = new Date(prevEnd.getTime() - len);
      return { start, end, prevStart, prevEnd };
    }
    return periodRange(filters.preset);
  }

  const inRange = (list, a, b) => list.filter(t => { const d = new Date(t.created_at); return d >= a && d <= b; });
  const applyDims = (list) => list.filter(t =>
    (!filters.dept || t.department === filters.dept) &&
    (!filters.company || t.company === filters.company) &&
    (!filters.location || t.location_code === filters.location) &&
    (!filters.shift || t.shift_id === filters.shift));

  // Delta chip: goodDown=true → a decrease is the good direction (e.g. positives).
  function delta(cur, prev, { pct = false, goodDown = false, neutral = false } = {}) {
    if (!filters.compare) return '';
    const diff = cur - prev;
    const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '—';
    const cls = neutral || diff === 0 ? 'delta-same' : ((goodDown ? diff < 0 : diff > 0) ? 'delta-up' : 'delta-down');
    return `<span class="delta-chip ${cls}" style="font-size:11px">${arrow} ${Math.abs(diff)}${pct ? '%' : ''}</span>`;
  }

  // ── Main render (data widgets only) ─────────────────────────────────────────
  function renderDashboard() {
    const base = applyDims(DB.tests().filter(t => canViewSite(t.location_code)));
    const { start, end, prevStart, prevEnd } = resolveRange();
    const tests = inRange(base, start, end);
    const prev = inRange(base, prevStart, prevEnd);
    const sum = summarize(tests), psum = summarize(prev);

    document.getElementById('range-label').textContent =
      `${fmtDay(start)} – ${fmtDay(end)}` + (filters.compare ? `  ·  ${T('vs','เทียบ')} ${fmtDay(prevStart)} – ${fmtDay(prevEnd)}` : '');

    const serious = sum.severity['no-drive'] + sum.severity.illegal;
    const pSerious = psum.severity['no-drive'] + psum.severity.illegal;
    const pendingAll = base.filter(t => !t.is_zero && t.action_taken === 'pending').length;

    // KPI tiles
    document.getElementById('stats').innerHTML = `
      <div class="stat accent-blue"><div class="label">${T('Total Tests','จำนวนตรวจ')}</div><div class="value">${sum.total}</div><div class="delta">${delta(sum.total, psum.total, { neutral: true })}</div></div>
      <div class="stat accent-green"><div class="label">${T('Pass Rate','อัตราผ่าน')}</div><div class="value">${sum.passRate}%</div><div class="delta">${delta(sum.passRate, psum.passRate, { pct: true })} <span class="muted">${sum.zero}/${sum.total}</span></div></div>
      <div class="stat accent-red"><div class="label">${T('Alcohol Detected','ตรวจพบ')}</div><div class="value">${sum.positive}</div><div class="delta">${delta(sum.positive, psum.positive, { goodDown: true })}</div></div>
      <div class="stat accent-red"><div class="label">${T('No-drive + Illegal','ห้ามขับ+ผิดกม.')}</div><div class="value">${serious}</div><div class="delta">${delta(serious, pSerious, { goodDown: true })}</div></div>
      <div class="stat"><div class="label">${T('Avg mg%','ค่าเฉลี่ย mg%')}</div><div class="value">${sum.avgValue}</div><div class="delta muted">${T('detected only','เฉพาะที่พบ')}</div></div>
      ${pendingAll ? `<div class="stat accent-red"><div class="label">${T('Pending','รอดำเนินการ')}</div><div class="value">${pendingAll}</div><div class="delta"><a href="admin-alerts.html" style="color:var(--danger)">${T('View →','ดู →')}</a></div></div>` : ''}`;

    // Adaptive trend
    const { gran, buckets } = bucketTests(tests, start, end);
    const maxB = Math.max(...buckets.map(b => b.tests.length), 1);
    // Weekly labels get a 'YY year suffix only when the trend crosses ISO years,
    // so "W1" vs "W52" of different years aren't confused (single-year stays clean).
    const wkYears = gran === 'week' ? new Set(buckets.map(b => isoWeek(b.start).year)) : null;
    document.getElementById('chart').innerHTML = buckets.length ? buckets.map(b => {
      const s = summarize(b.tests);
      const passH = s.zero / maxB * 100, posH = s.positive / maxB * 100;
      const iw = gran === 'week' ? isoWeek(b.start) : null;
      const lbl = gran === 'week' ? 'W' + iw.week + (wkYears.size > 1 ? "'" + String(iw.year).slice(-2) : '') : String(b.start.getDate());
      const dlabel = gran === 'week' ? `${fmtDay(b.start)} – ${fmtDay(b.end)}` : fmtDay(b.start);
      const tip = `${dlabel}\n${s.total} ${T('tests','ผล')} · ${s.zero} ${T('pass','ผ่าน')} · ${s.positive} ${T('detected','พบ')}`;
      return `<div class="trend-col" data-tip="${esc(tip)}">
        <div class="trend-stack">
          <div class="trend-seg pos" style="height:${posH}%; min-height:${s.positive ? 3 : 0}px"></div>
          <div class="trend-seg pass" style="height:${passH}%; min-height:${s.zero ? 3 : 0}px"></div>
        </div>
        <div class="t-lbl">${lbl}</div>
      </div>`;
    }).join('') : `<div class="muted small" style="margin:auto">${T('No tests in this period','ไม่มีข้อมูลในช่วงนี้')}</div>`;

    // Severity breakdown (stacked bar + legend)
    const total1 = sum.total || 1;
    document.getElementById('ratio').innerHTML = `
      <div class="sev-bar" style="margin-bottom:16px">
        ${SEV.map(([k,, cls]) => sum.severity[k] ? `<span class="dot-${cls}" style="flex:${sum.severity[k]} 1 0; background:var(--sev-${cls})" title="${sum.severity[k]}"></span>` : '').join('')}
      </div>
      <div class="col gap-sm">
        ${SEV.map(([k, label, cls]) => `
          <div class="row between">
            <span class="sev-chip sev-${cls}"><span class="sev-dot dot-${cls}"></span>${label}</span>
            <span class="small" style="font-weight:600">${sum.severity[k]} <span class="muted" style="font-weight:400">· ${Math.round(sum.severity[k]/total1*100)}%</span></span>
          </div>`).join('')}
      </div>
      <div class="divider"></div>
      <div style="text-align:center; font-size:13px"><span style="font-weight:700; color:var(--sev-pass)">${sum.passRate}%</span> <span class="muted">${T('pass rate','อัตราผ่าน')}</span></div>`;

    // Detection rate by shift
    document.getElementById('shift-analysis').innerHTML = SHIFTS.map(([id, label]) => {
      const st = tests.filter(t => t.shift_id === id);
      const pos = st.filter(t => !t.is_zero).length;
      const rate = st.length ? Math.round(pos / st.length * 100) : 0;
      return `<div class="mbar-row">
        <div class="mbar-name">${label}</div>
        <div class="mbar-track"><div class="mbar-fill danger" style="width:${rate}%"></div></div>
        <div class="mbar-val">${pos}/${st.length} · ${rate}%</div></div>`;
    }).join('');

    // Retest outcomes
    const rt = sum.retests;
    const rtCells = [
      [T('Required','ต้องตรวจซ้ำ'), rt.required, 'caution'],
      [T('Completed','เสร็จสิ้น'), rt.completed, 'pass'],
      [T('Failed','ล้มเหลว'), rt.failed, 'nodrive'],
    ];
    document.getElementById('retest-outcomes').innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; text-align:center">
        ${rtCells.map(([label, n, cls]) => `<div>
          <div style="font-size:30px; font-weight:700; color:var(--sev-${cls})">${n}</div>
          <div class="tiny muted">${label}</div></div>`).join('')}
      </div>
      ${rt.required + rt.completed + rt.failed === 0 ? `<div class="muted small" style="text-align:center; margin-top:12px">${T('No retests in this period','ไม่มีการตรวจซ้ำในช่วงนี้')}</div>` : ''}`;

    // Rankings by detection rate
    function topBy(groupKey, labelKey) {
      const g = {};
      tests.forEach(t => { const k = t[groupKey] || '?'; (g[k] ||= { total: 0, pos: 0, label: labelKey ? t[labelKey] || k : k }); g[k].total++; if (!t.is_zero) g[k].pos++; });
      return Object.values(g).filter(v => v.total >= 3).map(v => ({ label: v.label, rate: Math.round(v.pos / v.total * 100) })).sort((a, b) => b.rate - a.rate).slice(0, 5);
    }
    function renderRanking(id, items) {
      const maxRate = items[0]?.rate || 1;
      document.getElementById(id).innerHTML = items.length ? items.map((item, i) => `
        <div class="mbar-row">
          <div class="mbar-name" title="${esc(item.label)}"><span class="muted small" style="margin-right:4px">${i+1}.</span>${esc(item.label)}</div>
          <div class="mbar-track"><div class="mbar-fill danger" style="width:${item.rate/maxRate*100}%"></div></div>
          <div class="mbar-val" style="color:var(--sev-nodrive)">${item.rate}%</div></div>`).join('')
        : `<div class="muted small" style="padding:12px 0">${T('Insufficient data (≥3 results per group)','ข้อมูลไม่พอ (ต้องมี ≥3 ผลต่อกลุ่ม)')}</div>`;
    }
    renderRanking('top-sites', topBy('location_code', 'location_name'));
    renderRanking('top-depts', topBy('department'));

    // Repeat offenders
    const offenders = repeatOffenders(tests, 2);
    document.getElementById('repeat-offenders').innerHTML = offenders.length ? `
      <div class="table-wrap"><table class="table"><thead><tr>
        <th>${T('Name','ชื่อ')}</th><th>${T('Department','แผนก')}</th><th>${T('Detections','จำนวนพบ')}</th><th>${T('Max mg%','สูงสุด mg%')}</th><th>${T('Last','ล่าสุด')}</th>
      </tr></thead><tbody>${offenders.slice(0, 10).map(o => `<tr>
        <td style="font-weight:600">${esc(o.name)}</td>
        <td class="small">${esc(o.department)}</td>
        <td><span class="badge badge-danger">${o.count}×</span></td>
        <td class="small">${o.maxValue}</td>
        <td class="small muted">${formatDateShort(o.lastAt)}</td>
      </tr>`).join('')}</tbody></table></div>`
      : `<div class="muted small" style="padding:8px 0">${T('No repeat detections in this period','ไม่มีผู้ตรวจพบซ้ำในช่วงนี้')}</div>`;

    // Heatmap: weekday (Mon–Sun) × hour, positives in period
    const wdays = isEN ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] : ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
    const hm = Array.from({ length: 7 }, () => new Array(24).fill(0));
    for (const t of tests) { if (t.is_zero) continue; const td = new Date(t.created_at); hm[(td.getDay() + 6) % 7][td.getHours()]++; }
    const maxHm = Math.max(...hm.flat(), 1);
    const hmLevel = v => !v ? 0 : (v / maxHm < .25 ? 1 : v / maxHm < .5 ? 2 : v / maxHm < .75 ? 3 : 4);
    const hourLabels = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
    let hmHtml = `<div style="display:grid; grid-template-columns:70px repeat(24,22px); gap:3px; min-width:fit-content"><div></div>${hourLabels.map(h => `<div style="font-size:10px;color:var(--text-muted);text-align:center;padding:2px 0">${h}</div>`).join('')}`;
    for (let d = 0; d < 7; d++) {
      hmHtml += `<div class="hm-day-label">${wdays[d]}</div>`;
      for (let h = 0; h < 24; h++) { const v = hm[d][h]; hmHtml += `<div class="hm-cell" data-v="${hmLevel(v)}"${v ? ` data-tip="${wdays[d]} ${h}:00 · ${v} ${T('detected','พบ')}"` : ''}></div>`; }
    }
    document.getElementById('heatmap').innerHTML = hmHtml + '</div>';

    // Latest activity (dimension-filtered, not period-limited) + pending
    const latest = base.slice(0, 6);
    document.getElementById('latest').innerHTML = latest.length ? latest.map(t => `
      <div class="latest-row">
        <div class="avatar ${!t.is_zero ? 'red' : ''}">${esc((t.full_name || '?').charAt(0))}</div>
        <div style="flex:1"><div style="font-weight:600">${esc(t.full_name)}</div>
          <div class="tiny muted">${esc(t.department)} · ${esc(t.location_name)} · ${formatDate(t.created_at)}</div></div>
        ${thresholdBadge(t)}
      </div>`).join('') : `<div class="empty"><div class="icon">📋</div>${T('No data found','ยังไม่มีข้อมูล')}</div>`;

    const pendingTests = base.filter(t => !t.is_zero && t.action_taken === 'pending').slice(0, 5);
    document.getElementById('alert-card').style.display = pendingTests.length ? 'block' : 'none';
    if (pendingTests.length) {
      document.getElementById('pending-alerts').innerHTML = pendingTests.map(t => `
        <div class="latest-row">
          <div class="avatar red">${esc((t.full_name || '?').charAt(0))}</div>
          <div style="flex:1"><div style="font-weight:600">${esc(t.full_name)}</div>
            <div class="tiny muted">${esc(t.location_name)} · ${timeAgo(t.created_at)}</div></div>
          ${thresholdBadge(t)}
          <a href="admin-alerts.html" class="btn btn-sm btn-danger">${T('Action','ดำเนินการ')}</a>
        </div>`).join('');
    }
  }

  buildPeriodBar();
  renderDashboard();
  DB.startPolling(renderDashboard, 5000);
}
}); // DB.init
</script>
</body>
</html>
