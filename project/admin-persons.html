<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>พนักงาน — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="shared.css" />
<style>
  .tabs-page { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .tabs-page button { background:transparent; border:none; padding:10px 18px; font-family:inherit; font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs-page button.active { color:var(--brand); border-bottom-color:var(--brand); }
  .person-row { display:flex; gap:12px; align-items:center; padding:14px; border-bottom:1px solid var(--border); transition:background .1s; cursor:pointer; }
  .person-row:hover { background:var(--surface-2); }
  .person-row:last-child { border-bottom:none; }
  .av { width:40px; height:40px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-weight:700; font-size:15px; flex-shrink:0; }
  .av.red { background:var(--danger-soft); color:var(--danger); }
  .watchlist-card { background:var(--danger-soft); border:1px solid #fca5a5; border-radius:var(--r-md); padding:14px 18px; display:flex; gap:12px; align-items:center; margin-bottom:16px; }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:24px">
    <div>
      <h1 id="page-title"></h1>
      <div class="muted small" id="page-sub"></div>
    </div>
    <div class="row gap-sm">
      <input class="input" id="search" style="max-width:220px" oninput="renderPersons()" />
      <button class="btn btn-ghost btn-sm" id="template-btn" onclick="downloadTemplate()"></button>
      <button class="btn btn-ghost btn-sm" id="export-btn" onclick="exportCSV()"></button>
      <button class="btn btn-ghost btn-sm" id="import-btn" onclick="document.getElementById('csv-input').click()"></button>
      <input type="file" id="csv-input" accept=".csv,text/csv" style="display:none" onchange="importCSV(this)" />
      <button class="btn btn-primary" id="add-btn" onclick="openModal()"></button>
    </div>
  </div>

  <div class="tabs-page">
    <button class="active" data-tab="persons" onclick="switchTab('persons')" id="tab-btn-persons"></button>
    <button data-tab="watchlist" onclick="switchTab('watchlist')" id="tab-btn-watchlist">Watchlist <span id="wl-count"></span></button>
  </div>

  <div id="tab-persons"></div>
  <div id="tab-watchlist" style="display:none"></div>
</div>

<!-- Person modal (add/edit) -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <form id="form" onsubmit="save(event)">
      <div class="modal-body">
        <input type="hidden" name="id" />
        <div class="grid-2">
          <div class="field">
            <label id="lbl-emp-id"></label>
            <input class="input" name="employee_id" required placeholder="EMP001" />
          </div>
          <div class="field">
            <label id="lbl-fullname"></label>
            <input class="input" name="full_name" required />
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label id="lbl-dept"></label>
          <select class="select" name="department">
            <option value="" id="opt-dept-default"></option>
          </select>
        </div>
        <div class="field" style="margin-top:12px">
          <label id="lbl-company"></label>
          <input class="input" name="company" />
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="field">
            <label id="lbl-plate"></label>
            <input class="input" name="plate_number" placeholder="70-1234" />
          </div>
          <div class="field">
            <label id="lbl-phone"></label>
            <input class="input" name="phone" placeholder="081-xxx-xxxx" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="modal-cancel-btn" onclick="closeModal()"></button>
        <button type="submit" class="btn btn-primary" id="modal-save-btn"></button>
      </div>
    </form>
  </div>
</div>

<!-- History modal -->
<div class="modal-backdrop" id="history-modal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <h2 id="history-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('history-modal').classList.remove('show')">✕</button>
    </div>
    <div class="modal-body">
      <div id="history-stats" style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px"></div>
      <div class="divider"></div>
      <div id="history-timeline"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (requireAdmin()) {
  document.getElementById('chrome').innerHTML = renderTopbar('persons');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';
  const canMutate = hasRole('super', 'manager');

  document.getElementById('page-title').textContent = isEN ? 'Employees' : 'พนักงาน';
  document.getElementById('page-sub').textContent = isEN ? 'Employee list, test history, and watchlist' : 'รายชื่อพนักงาน ประวัติการตรวจ และรายการเฝ้าระวัง';
  document.getElementById('search').placeholder = isEN ? 'Search name / ID' : 'ค้นหาชื่อ / รหัส';
  document.getElementById('add-btn').textContent = isEN ? '+ Add Employee' : '+ เพิ่มพนักงาน';
  document.getElementById('template-btn').textContent = isEN ? '📋 Template' : '📋 Template';
  document.getElementById('export-btn').textContent = isEN ? '📤 Export CSV' : '📤 Export CSV';
  document.getElementById('import-btn').textContent = isEN ? '📥 Import CSV' : '📥 Import CSV';
  if (!canMutate) {
    document.getElementById('add-btn').style.display = 'none';
    document.getElementById('import-btn').style.display = 'none';
  }
  document.getElementById('tab-btn-persons').textContent = isEN ? 'Employee Registry' : 'ทะเบียนพนักงาน';

  // Modal labels
  document.getElementById('lbl-emp-id').innerHTML = `${isEN ? 'Employee ID' : 'รหัสพนักงาน'} <span style="color:var(--danger)">*</span>`;
  document.getElementById('lbl-fullname').innerHTML = `${isEN ? 'Full Name' : 'ชื่อ-นามสกุล'} <span style="color:var(--danger)">*</span>`;
  document.getElementById('lbl-dept').textContent = isEN ? 'Department' : 'แผนก';
  document.getElementById('opt-dept-default').textContent = isEN ? '-- Select --' : '-- เลือก --';
  document.getElementById('lbl-company').textContent = isEN ? 'Company' : 'บริษัท';
  document.getElementById('lbl-plate').textContent = isEN ? 'License Plate' : 'ทะเบียนรถ';
  document.getElementById('lbl-phone').textContent = isEN ? 'Phone' : 'โทรศัพท์';
  document.getElementById('modal-cancel-btn').textContent = isEN ? 'Cancel' : 'ยกเลิก';
  document.getElementById('modal-save-btn').textContent = isEN ? 'Save' : 'บันทึก';

  // Populate department select
  DEPARTMENTS.forEach(d => {
    document.querySelector('[name=department]').insertAdjacentHTML('beforeend', `<option value="${d}">${d}</option>`);
  });

  function switchTab(tab) {
    document.querySelectorAll('.tabs-page button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('tab-persons').style.display = tab === 'persons' ? 'block' : 'none';
    document.getElementById('tab-watchlist').style.display = tab === 'watchlist' ? 'block' : 'none';
    if (tab === 'persons') renderPersons();
    if (tab === 'watchlist') renderWatchlist();
  }

  function renderPersons() {
    const q = document.getElementById('search').value.toLowerCase();
    const persons = DB.persons().filter(p => !q || (p.full_name + p.employee_id + p.company).toLowerCase().includes(q));
    const el = document.getElementById('tab-persons');
    if (!persons.length) {
      el.innerHTML = `<div class="empty"><div class="icon">👤</div>${isEN ? 'No employee data found' : 'ไม่พบข้อมูลพนักงาน'}</div>`;
      return;
    }
    const wl = new Set(DB.watchlist().map(w => w.full_name));
    // Pre-bucket tests by employee_id once — avoids an O(n) scan per person
    // (which was O(persons × tests) per render on a 5s poll).
    const testsByEmp = new Map();
    for (const t of DB.tests()) {
      const key = t.employee_id;
      if (!key) continue;
      const arr = testsByEmp.get(key);
      if (arr) arr.push(t); else testsByEmp.set(key, [t]);
    }
    el.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>${isEN ? 'ID' : 'รหัส'}</th><th>${isEN ? 'Name' : 'ชื่อ'}</th><th>${isEN ? 'Department' : 'แผนก'}</th><th>${isEN ? 'Company' : 'บริษัท'}</th><th>${isEN ? 'License Plate' : 'ทะเบียน'}</th><th>${isEN ? 'History' : 'ประวัติ'}</th><th></th></tr>
          </thead>
          <tbody>
            ${persons.map(p => {
              const tests = testsByEmp.get(p.employee_id) || [];
              const fails = tests.filter(t => !t.is_zero).length;
              const inWl = wl.has(p.full_name);
              return `
                <tr>
                  <td class="small" style="font-family:var(--font-mono)">${esc(p.employee_id)}</td>
                  <td>
                    <div style="font-weight:600">${esc(p.full_name)}
                      ${inWl ? '<span class="badge badge-danger" style="margin-left:6px; font-size:10px">⚠ Watchlist</span>' : ''}
                    </div>
                    ${p.phone ? `<div class="tiny muted">${esc(p.phone)}</div>` : ''}
                  </td>
                  <td class="small">${esc(p.department) || '—'}</td>
                  <td class="small">${esc(p.company) || '—'}</td>
                  <td class="small" style="font-family:var(--font-mono)">${esc(p.plate_number) || '—'}</td>
                  <td>
                    <span class="small">${tests.length} ${isEN ? 'times' : 'ครั้ง'}</span>
                    ${fails > 0 ? `<span class="badge badge-danger" style="margin-left:4px">${fails} ${isEN ? 'Fail' : 'ไม่ผ่าน'}</span>` : ''}
                  </td>
                  <td style="text-align:right">
                    <button class="btn btn-sm" data-history-emp="${esc(p.employee_id)}">${isEN ? 'History' : 'ประวัติ'}</button>
                    ${canMutate ? `<button class="btn btn-sm" data-edit-id="${esc(p.id)}">${isEN ? 'Edit' : 'แก้ไข'}</button>` : ''}
                    ${canMutate ? `<button class="btn btn-sm btn-danger" data-del-id="${esc(p.id)}">${isEN ? 'Delete' : 'ลบ'}</button>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    // Wire row-action buttons via data-* attributes — avoids JSON.stringify
    // into onclick='openModal(${...})', where any apostrophe in user data
    // breaks out of the JS string (was a stored-XSS hole).
    el.querySelectorAll('button[data-history-emp]').forEach(b => b.addEventListener('click', () => viewHistory(b.getAttribute('data-history-emp'))));
    el.querySelectorAll('button[data-edit-id]').forEach(b => b.addEventListener('click', () => {
      const p = DB.persons().find(x => x.id === b.getAttribute('data-edit-id'));
      if (p) openModal(p);
    }));
    el.querySelectorAll('button[data-del-id]').forEach(b => b.addEventListener('click', () => del(b.getAttribute('data-del-id'))));
  }

  function renderWatchlist() {
    const wl = DB.all.watchlist || [];
    const el = document.getElementById('tab-watchlist');
    const wlCount = document.getElementById('wl-count');
    if (wlCount) wlCount.innerHTML = wl.length ? `<span class="pill-dot" style="margin-left:4px">${wl.length}</span>` : '';
    if (!wl.length) {
      el.innerHTML = `
        <div class="banner banner-success"><span class="banner-icon">✅</span><div>${isEN ? 'No employees on the watchlist' : 'ไม่มีพนักงานในรายการเฝ้าระวัง'}</div></div>
        <div class="empty"><div class="icon">👁</div>${isEN ? `Employees are added automatically after ${DB.settings().watchlist_threshold || 2} fails within ${DB.settings().watchlist_window_days || 30} days` : `ระบบจะเพิ่มพนักงานอัตโนมัติเมื่อตรวจไม่ผ่าน ${DB.settings().watchlist_threshold || 2} ครั้ง ใน ${DB.settings().watchlist_window_days || 30} วัน`}</div>`;
      return;
    }
    el.innerHTML = `
      <div class="banner banner-warn" style="margin-bottom:16px">
        <span class="banner-icon">⚠️</span>
        <div class="small">${isEN ? `Employees on this list had alcohol detected ${DB.settings().watchlist_threshold || 2}+ times within ${DB.settings().watchlist_window_days || 30} days — requires special monitoring` : `พนักงานในรายการนี้ตรวจพบแอลกอฮอล์ ${DB.settings().watchlist_threshold || 2}+ ครั้ง ใน ${DB.settings().watchlist_window_days || 30} วัน — ต้องเฝ้าระวังพิเศษ`}</div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>${isEN ? 'Name' : 'ชื่อ'}</th><th>${isEN ? 'Employee ID' : 'รหัสพนักงาน'}</th><th>${isEN ? 'Reason' : 'เหตุผล'}</th><th>${isEN ? 'Date Added' : 'วันที่เพิ่ม'}</th><th></th></tr></thead>
          <tbody>
            ${wl.map(w => `
              <tr>
                <td>
                  <div class="row gap-sm">
                    <div class="av red">${esc(w.full_name.charAt(0))}</div>
                    <span style="font-weight:600">${esc(w.full_name)}</span>
                  </div>
                </td>
                <td class="small" style="font-family:var(--font-mono)">${esc(w.employee_id) || '—'}</td>
                <td class="small muted">${esc(w.reason)}</td>
                <td class="small">${formatDateShort(w.added_at)}</td>
                <td style="text-align:right">
                  <button class="btn btn-sm" data-wl-id="${esc(w.id)}">${isEN ? 'View History' : 'ดูประวัติ'}</button>
                  <button class="btn btn-sm" onclick="removeWL('${w.id}')">${isEN ? 'Remove' : 'นำออก'}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
    // Resolve View-History clicks via watchlist id rather than injecting
    // w.full_name into an inline onclick (was a JS-string-escape XSS hole —
    // esc() only escapes for the HTML context, not for the inner JS string).
    el.querySelectorAll('button[data-wl-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const w = (DB.watchlist() || []).find(x => x.id === btn.getAttribute('data-wl-id'));
        if (w) viewHistory(w.employee_id || null, w.full_name);
      });
    });
  }

  function viewHistory(empId, name) {
    let tests;
    if (empId) tests = DB.testsByEmployee(empId);
    else tests = DB.testsByPerson(name);
    const person = empId ? DB.persons().find(p => p.employee_id === empId) : null;
    const displayName = person?.full_name || name || empId;
    const total = tests.length;
    const fails = tests.filter(t => !t.is_zero).length;
    const passRate = total ? Math.round((total - fails) / total * 100) : 100;
    document.getElementById('history-title').textContent = (isEN ? 'History: ' : 'ประวัติ: ') + displayName;
    document.getElementById('history-stats').innerHTML = `
      <div class="stat"><div class="label">${isEN ? 'Total Tests' : 'ตรวจทั้งหมด'}</div><div class="value" style="font-size:24px">${total}</div></div>
      <div class="stat accent-green"><div class="label">${isEN ? 'Pass' : 'ผ่าน'}</div><div class="value" style="font-size:24px">${total - fails}</div></div>
      <div class="stat accent-red"><div class="label">${isEN ? 'Fail' : 'ไม่ผ่าน'}</div><div class="value" style="font-size:24px">${fails}</div></div>
    `;
    if (!tests.length) {
      document.getElementById('history-timeline').innerHTML = `<div class="empty" style="padding:32px 0"><div class="icon">📋</div>${isEN ? 'No test history yet' : 'ยังไม่มีประวัติการตรวจ'}</div>`;
    } else {
      document.getElementById('history-timeline').innerHTML = `
        <div class="timeline" style="margin-top:16px">
          ${tests.map(t => `
            <div class="timeline-item${!t.is_zero ? ' danger' : ''}">
              <div class="row between">
                <div>
                  <span style="font-weight:600">${esc(t.location_name)}</span>
                  <span class="muted small" style="margin-left:8px">${esc(t.department)}</span>
                </div>
                ${thresholdBadge(t)}
              </div>
              <div class="tiny muted" style="margin-top:4px">${formatDate(t.created_at)} · ${esc(t.company)}</div>
              ${t.action_taken && t.action_taken !== 'pending' ? `<div class="tiny" style="margin-top:4px">${isEN ? 'Action' : 'การดำเนินการ'}: ${isEN ? {'sent-home':'Sent Home','suspended':'Suspended','allowed':'Allowed'}[t.action_taken] || t.action_taken : {'sent-home':'ส่งกลับบ้าน','suspended':'พักงาน','allowed':'อนุญาต'}[t.action_taken] || t.action_taken}</div>` : ''}
            </div>
          `).join('')}
        </div>`;
    }
    document.getElementById('history-modal').classList.add('show');
  }

  function removeWL(id) {
    if (!canMutate) return;
    if (!confirm(isEN ? 'Remove employee from Watchlist?' : 'นำพนักงานออกจาก Watchlist?')) return;
    DB.removeFromWatchlist(id);
    showToast(isEN ? 'Removed from Watchlist' : 'นำออกจาก Watchlist แล้ว');
    renderWatchlist();
  }

  function openModal(p) {
    if (!canMutate) return;
    document.getElementById('modal-title').textContent = p ? (isEN ? 'Edit Employee' : 'แก้ไขพนักงาน') : (isEN ? 'Add Employee' : 'เพิ่มพนักงาน');
    const f = document.getElementById('form');
    f.reset();
    if (p) {
      f.id.value = p.id || '';
      f.employee_id.value = p.employee_id || '';
      f.full_name.value = p.full_name || '';
      f.department.value = p.department || '';
      f.company.value = p.company || '';
      f.plate_number.value = p.plate_number || '';
      f.phone.value = p.phone || '';
    }
    document.getElementById('modal').classList.add('show');
  }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }
  function save(e) {
    e.preventDefault();
    if (!canMutate) return;
    const f = e.target;
    const p = { employee_id: f.employee_id.value.trim(), full_name: f.full_name.value.trim(), department: f.department.value, company: f.company.value.trim(), plate_number: f.plate_number.value.trim(), phone: f.phone.value.trim() };
    if (f.id.value) p.id = f.id.value;
    DB.upsertPerson(p);
    showToast(isEN ? 'Saved' : 'บันทึกเรียบร้อย');
    closeModal();
    renderPersons();
  }
  function del(id) {
    if (!canMutate) return;
    if (!confirm(isEN ? 'Confirm delete this employee?' : 'ยืนยันการลบพนักงาน?')) return;
    DB.deletePerson(id);
    showToast(isEN ? 'Deleted' : 'ลบเรียบร้อย');
    renderPersons();
  }

  const CSV_HEADERS = ['employee_id', 'full_name', 'department', 'company', 'plate_number', 'phone'];

  function csvEscape(v) {
    const s = String(v ?? '');
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function downloadTemplate() {
    const example = ['EMP001', isEN ? 'John Smith' : 'สมชาย ใจดี', 'Production', isEN ? 'BRF Co. Ltd.' : 'บริษัท ตัวอย่าง จำกัด', '70-1234', '081-000-0001'];
    const rows = [CSV_HEADERS.join(','), example.map(csvEscape).join(',')];
    triggerCSVDownload(rows.join('\r\n'), 'employee_template.csv');
  }

  function exportCSV() {
    const persons = DB.persons();
    if (!persons.length) { showToast(isEN ? 'No data to export' : 'ไม่มีข้อมูลให้ Export'); return; }
    const rows = [CSV_HEADERS.join(','), ...persons.map(p => CSV_HEADERS.map(h => csvEscape(p[h])).join(','))];
    triggerCSVDownload(rows.join('\r\n'), `employees_${new Date().toISOString().slice(0,10)}.csv`);
    showToast(isEN ? `Exported ${persons.length} records` : `Export ${persons.length} รายการแล้ว`);
  }

  function triggerCSVDownload(content, filename) {
    const blob = new Blob(['﻿' + content], { type: 'text/csv;charset=utf-8;' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: filename });
    a.click(); URL.revokeObjectURL(a.href);
  }

  function importCSV(input) {
    if (!canMutate || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const lines = e.target.result.replace(/\r/g, '').split('\n').filter(l => l.trim());
        const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
        const idCol = header.indexOf('employee_id');
        const nameCol = header.indexOf('full_name');
        if (idCol < 0 || nameCol < 0) {
          showToast(isEN ? 'CSV missing required columns: employee_id, full_name' : 'CSV ขาดคอลัมน์ที่จำเป็น: employee_id, full_name');
          return;
        }
        const parseRow = (line) => {
          const cols = []; let cur = ''; let inQ = false;
          for (let i = 0; i < line.length; i++) {
            if (line[i] === '"' && !inQ) { inQ = true; }
            else if (line[i] === '"' && inQ && line[i+1] === '"') { cur += '"'; i++; }
            else if (line[i] === '"' && inQ) { inQ = false; }
            else if (line[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else { cur += line[i]; }
          }
          cols.push(cur.trim());
          return cols;
        };
        const getCol = (cols, key) => { const i = header.indexOf(key); return i >= 0 ? (cols[i] || '').trim() : ''; };
        let imported = 0, skipped = 0;
        const promises = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = parseRow(lines[i]);
          const empId = getCol(cols, 'employee_id');
          const fullName = getCol(cols, 'full_name');
          if (!empId || !fullName) { skipped++; continue; }
          promises.push(DB.upsertPerson({
            employee_id: empId, full_name: fullName,
            department: getCol(cols, 'department'), company: getCol(cols, 'company'),
            plate_number: getCol(cols, 'plate_number'), phone: getCol(cols, 'phone')
          }));
          imported++;
        }
        await Promise.all(promises);
        input.value = '';
        DB._initialized = false;
        await DB.init();
        renderPersons();
        renderWatchlist();
        showToast(isEN ? `Imported ${imported} records${skipped ? `, skipped ${skipped}` : ''}` : `Import ${imported} รายการ${skipped ? ` (ข้าม ${skipped})` : ''} เสร็จแล้ว`);
      } catch (err) {
        showToast((isEN ? 'Import failed: ' : 'นำเข้าไม่สำเร็จ: ') + (err.message || err));
        input.value = '';
      }
    };
    reader.readAsText(input.files[0], 'UTF-8');
  }

  Object.assign(window, { switchTab, openModal, closeModal, save, del, viewHistory, removeWL, renderPersons, downloadTemplate, exportCSV, importCSV });
  DB.startPolling(() => { renderPersons(); renderWatchlist(); }, 5000);
  renderPersons();
  renderWatchlist();
}
}); // DB.init
</script>
</body>
</html>
