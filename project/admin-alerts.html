<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<script>(function(){if(!/\.github\.io$/i.test(location.hostname))return;var f=(location.pathname.match(/\/project\/(.*)$/)||["",""])[1];location.replace("https://alcohol-test-system.securitycompliance.workers.dev/"+f+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ศูนย์แจ้งเตือน — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="shared.css" />
<style>
  .alert-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; margin-bottom: 12px; display: flex; gap: 16px; align-items: flex-start; transition: box-shadow .15s; }
  .alert-row:hover { box-shadow: var(--shadow-md); }
  .alert-row.pending { border-left: 4px solid var(--danger); }
  .alert-row.resolved { border-left: 4px solid var(--success); opacity: .7; }
  .alert-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .alert-avatar.ok { background: var(--success-soft); color: var(--success); }
  .action-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .action-note { margin-top: 8px; display: none; }
  .action-note.show { display: block; }
  .channel-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .channel-row:last-child { border-bottom: none; }
  .channel-icon { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 18px; }
  .tabs-page { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tabs-page button { background: transparent; border: none; padding: 10px 18px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs-page button.active { color: var(--brand); border-bottom-color: var(--brand); }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:24px">
    <div>
      <h1 id="page-title"></h1>
      <div class="muted small" id="page-sub"></div>
    </div>
    <div id="hdr-badges"></div>
  </div>

  <div class="stats" style="margin-bottom:24px" id="stats"></div>

  <div class="tabs-page" id="tabs">
    <button class="active" data-tab="pending" onclick="switchTab('pending')" id="tab-btn-pending"></button>
    <button data-tab="resolved" onclick="switchTab('resolved')" id="tab-btn-resolved"></button>
    <button data-tab="channels" onclick="switchTab('channels')" id="tab-btn-channels"></button>
  </div>

  <div id="tab-pending"></div>
  <div id="tab-resolved" style="display:none"></div>
  <div id="tab-channels" style="display:none"></div>
</div>

<!-- Action modal -->
<div class="modal-backdrop" id="action-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="action-modal-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="closeActionModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="action-test-info" style="margin-bottom:16px"></div>
      <div class="field" style="margin-bottom:14px">
        <label id="action-select-label"></label>
        <select class="select" id="action-select">
          <option value="sent-home" id="opt-sent-home"></option>
          <option value="suspended" id="opt-suspended"></option>
          <option value="allowed" id="opt-allowed"></option>
        </select>
      </div>
      <div class="field">
        <label id="action-note-label"></label>
        <textarea class="textarea" id="action-note-input"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="action-cancel-btn" onclick="closeActionModal()"></button>
      <button class="btn btn-primary" id="action-save-btn" onclick="saveAction()"></button>
    </div>
  </div>
</div>

<!-- Channel modal -->
<div class="modal-backdrop" id="ch-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="ch-modal-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('ch-modal').classList.remove('show')">✕</button>
    </div>
    <form id="ch-form" onsubmit="saveCh(event)">
      <div class="modal-body">
        <input type="hidden" name="id" />
        <div class="field" style="margin-bottom:12px">
          <label id="ch-kind-label"></label>
          <select class="select" name="kind">
            <option value="line">LINE Notify</option>
            <option value="email">Email</option>
            <option value="webhook">Webhook (Slack/Teams)</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:12px">
          <label id="ch-label-label"></label>
          <input class="input" name="label" required id="ch-label-input" />
        </div>
        <div class="field" style="margin-bottom:12px">
          <label>Target (Token/Email/URL)</label>
          <input class="input" name="target" required placeholder="LINE token / email address / webhook URL" />
        </div>
        <div class="row gap-md">
          <label class="switch"><input type="checkbox" name="enabled" checked /><span class="slide"></span></label>
          <span class="small" id="ch-enabled-label"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="ch-cancel-btn" onclick="document.getElementById('ch-modal').classList.remove('show')"></button>
        <button type="submit" class="btn btn-primary" id="ch-save-btn"></button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (requireAdmin()) {
  document.getElementById('chrome').innerHTML = renderTopbar('alerts');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';
  const canAct = hasRole('super', 'manager');

  document.getElementById('page-title').textContent = isEN ? 'Alert Center' : 'ศูนย์แจ้งเตือน';
  document.getElementById('page-sub').textContent = isEN ? 'Failed tests requiring action' : 'ผลตรวจที่ไม่ผ่านและต้องดำเนินการ';
  document.getElementById('tab-btn-pending').innerHTML = (isEN ? 'Pending' : 'รอดำเนินการ') + ' <span id="pending-count-tab"></span>';
  document.getElementById('tab-btn-resolved').textContent = isEN ? 'Resolved' : 'ดำเนินการแล้ว';
  document.getElementById('tab-btn-channels').textContent = isEN ? 'Notification Channels' : 'ช่องทางแจ้งเตือน';

  // Action modal labels
  document.getElementById('action-modal-title').textContent = isEN ? 'Log Action' : 'บันทึกการดำเนินการ';
  document.getElementById('action-select-label').textContent = isEN ? 'Action Taken' : 'การดำเนินการ';
  document.getElementById('opt-sent-home').textContent = isEN ? 'Sent Home' : 'ส่งกลับบ้าน (Sent Home)';
  document.getElementById('opt-suspended').textContent = isEN ? 'Suspended' : 'พักงาน (Suspended)';
  document.getElementById('opt-allowed').textContent = isEN ? 'Allowed to Work' : 'อนุญาตให้ทำงาน (Allowed)';
  document.getElementById('action-note-label').textContent = isEN ? 'Notes' : 'หมายเหตุ';
  document.getElementById('action-note-input').placeholder = isEN ? 'Reason or additional details...' : 'เหตุผลหรือรายละเอียดเพิ่มเติม...';
  document.getElementById('action-cancel-btn').textContent = isEN ? 'Cancel' : 'ยกเลิก';
  document.getElementById('action-save-btn').textContent = isEN ? 'Save' : 'บันทึก';

  // Channel modal labels
  document.getElementById('ch-kind-label').textContent = isEN ? 'Type' : 'ประเภท';
  document.getElementById('ch-label-label').textContent = isEN ? 'Name / Description' : 'ชื่อ / คำอธิบาย';
  document.getElementById('ch-label-input').placeholder = isEN ? 'e.g. LINE — Safety Team' : 'เช่น LINE — ทีมความปลอดภัย';
  document.getElementById('ch-enabled-label').textContent = isEN ? 'Enabled' : 'เปิดใช้งาน';
  document.getElementById('ch-cancel-btn').textContent = isEN ? 'Cancel' : 'ยกเลิก';
  document.getElementById('ch-save-btn').textContent = isEN ? 'Save' : 'บันทึก';

  let activeTab = 'pending';
  let actionTestId = null;

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tabs-page button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    ['pending','resolved','channels'].forEach(t => {
      document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
    });
  }

  function renderStats() {
    const tests = DB.tests().filter(t => !t.is_zero);
    const pending = tests.filter(t => t.action_taken === 'pending');
    const today = new Date(); today.setHours(0,0,0,0);
    const todayResolved = tests.filter(t => t.action_taken && t.action_taken !== 'pending' && new Date(t.created_at) >= today);
    const todayFails = tests.filter(t => new Date(t.created_at) >= today);
    document.getElementById('stats').innerHTML = `
      <div class="stat accent-red"><div class="label">${isEN ? 'Pending' : 'รอดำเนินการ'}</div><div class="value">${pending.length}</div><div class="delta">${isEN ? 'Not yet reviewed' : 'ยังไม่ได้ตรวจสอบ'}</div></div>
      <div class="stat"><div class="label">${isEN ? 'Resolved Today' : 'แก้ไขแล้ววันนี้'}</div><div class="value">${todayResolved.length}</div><div class="delta">${new Date().toLocaleDateString(isEN ? 'en-GB' : 'th-TH',{day:'numeric',month:'short'})}</div></div>
      <div class="stat accent-red"><div class="label">${isEN ? 'Alcohol Detected Today' : 'พบแอลกอฮอล์วันนี้'}</div><div class="value">${todayFails.length}</div><div class="delta">${isEN ? 'All locations' : 'ทุกสถานที่'}</div></div>
      <div class="stat accent-blue"><div class="label">${isEN ? 'Notification Channels' : 'ช่องทางแจ้งเตือน'}</div><div class="value">${DB.channels().filter(c=>c.enabled).length}</div><div class="delta">${isEN ? 'Active' : 'ใช้งานอยู่'}</div></div>
    `;
    const pc = document.getElementById('pending-count-tab');
    if (pc) pc.innerHTML = pending.length ? `<span class="pill-dot" style="margin-left:4px">${pending.length}</span>` : '';
  }

  function renderPending() {
    const tests = DB.tests().filter(t => !t.is_zero && t.action_taken === 'pending');
    const el = document.getElementById('tab-pending');
    if (!tests.length) {
      el.innerHTML = `<div class="empty"><div class="icon">✅</div>${isEN ? 'No pending items' : 'ไม่มีรายการรอดำเนินการ'}</div>`;
      return;
    }
    el.innerHTML = tests.map(t => `
      <div class="alert-row pending" id="ar-${t.id}">
        <div class="alert-avatar">${esc(t.full_name.charAt(0))}</div>
        <div style="flex:1">
          <div class="row between">
            <div>
              <span style="font-weight:700">${esc(t.full_name)}</span>
              <span class="muted small" style="margin-left:8px">${esc(t.department)}</span>
            </div>
            <span class="tiny muted">${timeAgo(t.created_at)}</span>
          </div>
          <div class="tiny muted" style="margin:4px 0">${esc(t.location_name)} (${esc(t.location_code)}) · ${esc(t.company)}</div>
          <div style="margin:8px 0">${thresholdBadge(t)}</div>
          <div class="action-row">
            <button class="btn btn-sm" onclick="openActionModal('${t.id}')">✍ ${isEN ? 'Log Action' : 'บันทึกการดำเนินการ'}</button>
            ${!t.retest_of ? `<a href="user-retest.html?test_id=${t.id}" class="btn btn-sm">🔁 ${isEN ? 'Send for Re-test' : 'ส่งตรวจซ้ำ'}</a>` : `<span class="action-chip action-pending">${isEN ? 'Re-tested' : 'ตรวจซ้ำแล้ว'}</span>`}
            <button class="btn btn-sm" onclick="viewTestDetail('${t.id}')">${isEN ? 'View Details' : 'ดูรายละเอียด'}</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderResolved() {
    const tests = DB.tests().filter(t => !t.is_zero && t.action_taken && t.action_taken !== 'pending');
    const el = document.getElementById('tab-resolved');
    if (!tests.length) {
      el.innerHTML = `<div class="empty"><div class="icon">📋</div>${isEN ? 'No resolved items yet' : 'ยังไม่มีรายการที่ดำเนินการแล้ว'}</div>`;
      return;
    }
    el.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>${isEN ? 'Date' : 'วันที่'}</th><th>${isEN ? 'Name' : 'ชื่อ'}</th><th>${isEN ? 'Test Result' : 'ผลตรวจ'}</th><th>${isEN ? 'Action Taken' : 'การดำเนินการ'}</th><th>${isEN ? 'Notes' : 'หมายเหตุ'}</th></tr></thead>
          <tbody>
            ${tests.map(t => `
              <tr>
                <td class="small">${formatDateShort(t.created_at)}</td>
                <td>
                  <div style="font-weight:600">${esc(t.full_name)}</div>
                  <div class="tiny muted">${esc(t.location_name)}</div>
                </td>
                <td>${thresholdBadge(t)}</td>
                <td><span class="action-chip action-${t.action_taken}">${actionLabel(t.action_taken)}</span></td>
                <td class="small muted">${esc(t.action_note) || '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function renderChannels() {
    const el = document.getElementById('tab-channels');
    const channels = DB.channels();
    el.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="card-header">
          <div>
            <h2>${isEN ? 'Notification Channels' : 'ช่องทางแจ้งเตือน'}</h2>
            <div class="muted small">${isEN ? 'When a test fails, the system will send alerts via enabled channels.' : 'เมื่อพบผลตรวจไม่ผ่าน ระบบจะส่งแจ้งเตือนผ่านช่องทางที่เปิดใช้งาน'}</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openChModal()">+ ${isEN ? 'Add Channel' : 'เพิ่มช่องทาง'}</button>
        </div>
        ${channels.length ? channels.map(c => `
          <div class="channel-row">
            <div class="row gap-md">
              <div class="channel-icon" style="background:${chColor(c.kind)}">${chIcon(c.kind)}</div>
              <div>
                <div style="font-weight:600">${esc(c.label)}</div>
                <div class="tiny muted" style="font-family:var(--font-mono)">${esc(c.target)}</div>
              </div>
            </div>
            <div class="row gap-sm">
              <label class="switch" title="${c.enabled ? (isEN ? 'Active' : 'เปิดอยู่') : (isEN ? 'Inactive' : 'ปิดอยู่')}">
                <input type="checkbox" ${c.enabled ? 'checked' : ''} onchange="toggleChannel('${c.id}', this.checked)" />
                <span class="slide"></span>
              </label>
              <button class="btn btn-sm" onclick="openChModal(${JSON.stringify(c).replace(/"/g,'&quot;')})">${isEN ? 'Edit' : 'แก้ไข'}</button>
              <button class="btn btn-sm btn-danger" onclick="delChannel('${c.id}')">${isEN ? 'Delete' : 'ลบ'}</button>
            </div>
          </div>
        `).join('') : `<div class="empty" style="padding:40px"><div class="icon">📣</div>${isEN ? 'No notification channels yet' : 'ยังไม่มีช่องทางแจ้งเตือน'}</div>`}
      </div>
      <div class="banner banner-info">
        <span class="banner-icon">ℹ️</span>
        <div class="small">${isEN ? 'In production, connect a real LINE Notify Token or Email SMTP — must be done via backend (Supabase Edge Function or server) due to CORS restrictions.' : 'ใน production ให้เชื่อม LINE Notify Token หรือ Email SMTP จริง — ต้องทำผ่าน backend (Supabase Edge Function หรือ server) เนื่องจาก CORS restrictions'}</div>
      </div>
    `;
  }

  function chColor(kind) {
    return kind === 'line' ? '#07b53b22' : kind === 'email' ? '#e0f2fe' : '#f3e8ff';
  }
  function chIcon(kind) {
    return kind === 'line' ? '💬' : kind === 'email' ? '📧' : '🔔';
  }
  function actionLabel(a) {
    const map = isEN
      ? { 'sent-home': 'Sent Home', 'suspended': 'Suspended', 'allowed': 'Allowed', 'pending': 'Pending' }
      : { 'sent-home': 'ส่งกลับบ้าน', 'suspended': 'พักงาน', 'allowed': 'อนุญาต', 'pending': 'รอดำเนินการ' };
    return map[a] || a;
  }

  function openActionModal(id) {
    actionTestId = id;
    const t = DB.tests().find(x => x.id === id);
    document.getElementById('action-test-info').innerHTML = `
      <div style="background:var(--surface-2); padding:12px; border-radius:var(--r-md)">
        <div style="font-weight:600; margin-bottom:4px">${esc(t.full_name)}</div>
        <div class="small muted">${esc(t.department)} · ${esc(t.location_name)}</div>
        <div style="margin-top:8px">${thresholdBadge(t)}</div>
      </div>`;
    document.getElementById('action-select').value = t.action_taken || 'sent-home';
    document.getElementById('action-note-input').value = t.action_note || '';
    document.getElementById('action-modal').classList.add('show');
  }
  function closeActionModal() { document.getElementById('action-modal').classList.remove('show'); }
  function saveAction() {
    if (!canAct) { showToast(isEN ? 'No permission' : 'ไม่มีสิทธิ์'); return; }
    const action = document.getElementById('action-select').value;
    const note = document.getElementById('action-note-input').value.trim();
    DB.updateTest(actionTestId, { action_taken: action, action_note: note, action_by: currentUser()?.id }, currentUser());
    showToast(isEN ? 'Action saved' : 'บันทึกการดำเนินการเรียบร้อย');
    closeActionModal();
    renderAll();
  }

  function viewTestDetail(id) {
    location.href = `admin-tests.html?open=${id}`;
  }

  function openChModal(c) {
    const f = document.getElementById('ch-form');
    f.reset();
    document.getElementById('ch-modal-title').textContent = c ? (isEN ? 'Edit Channel' : 'แก้ไขช่องทาง') : (isEN ? 'Add Channel' : 'เพิ่มช่องทาง');
    if (c) {
      f.id.value = c.id;
      f.kind.value = c.kind;
      f.label.value = c.label;
      f.target.value = c.target;
      f.enabled.checked = c.enabled;
    }
    document.getElementById('ch-modal').classList.add('show');
  }
  function saveCh(e) {
    e.preventDefault();
    if (!canAct) return;
    const f = e.target;
    DB.upsertChannel({ id: f.id.value || undefined, kind: f.kind.value, label: f.label.value.trim(), target: f.target.value.trim(), enabled: f.enabled.checked });
    showToast(isEN ? 'Saved' : 'บันทึกเรียบร้อย');
    document.getElementById('ch-modal').classList.remove('show');
    renderChannels();
  }
  function toggleChannel(id, enabled) {
    if (!canAct) return;
    const ch = DB.channels().find(c => c.id === id);
    if (ch) DB.upsertChannel({ ...ch, enabled });
    showToast(enabled ? (isEN ? 'Channel enabled' : 'เปิดช่องทางแจ้งเตือน') : (isEN ? 'Channel disabled' : 'ปิดช่องทางแจ้งเตือน'));
  }
  function delChannel(id) {
    if (!canAct) return;
    if (!confirm(isEN ? 'Confirm delete this channel?' : 'ยืนยันการลบช่องทางแจ้งเตือนนี้?')) return;
    DB.deleteChannel(id);
    showToast(isEN ? 'Deleted' : 'ลบเรียบร้อย');
    renderChannels();
  }

  function renderAll() {
    renderStats();
    renderPending();
    renderResolved();
    renderChannels();
  }

  Object.assign(window, { switchTab, openActionModal, closeActionModal, saveAction, viewTestDetail, openChModal, saveCh, toggleChannel, delChannel });
  renderAll();
  DB.startPolling(renderAll, 5000);
}
}); // DB.init
</script>
</body>
</html>
