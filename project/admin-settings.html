<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ตั้งค่าระบบ — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  .tabs-page { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .tabs-page button { background:transparent; border:none; padding:10px 18px; font-family:inherit; font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs-page button.active { color:var(--brand); border-bottom-color:var(--brand); }
  .setting-row { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); gap:24px; }
  .setting-row:last-child { border-bottom:none; }
  .setting-label { flex:1; }
  .setting-label .name { font-weight:600; font-size:15px; }
  .setting-label .desc { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .setting-ctrl { flex-shrink:0; min-width:160px; }
  .role-badge { display:inline-flex; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .role-super { background:var(--brand-soft); color:var(--brand); }
  .role-manager { background:var(--success-soft); color:var(--success); }
  .role-viewer { background:var(--warn-soft); color:var(--warn); }
  .role-auditor { background:var(--danger-soft); color:var(--danger); }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div style="margin-bottom:24px">
    <h1>ตั้งค่าระบบ</h1>
    <div class="muted small">จัดการการตั้งค่า ผู้ใช้ และช่องทางแจ้งเตือน</div>
  </div>

  <div class="tabs-page">
    <button class="active" data-tab="system" onclick="switchTab('system')">ระบบ</button>
    <button data-tab="users" onclick="switchTab('users')">ผู้ใช้งาน</button>
    <button data-tab="thresholds" onclick="switchTab('thresholds')">เกณฑ์แอลกอฮอล์</button>
    <button data-tab="shifts" onclick="switchTab('shifts')">กะทำงาน</button>
    <button data-tab="danger" onclick="switchTab('danger')">อันตราย</button>
  </div>

  <div id="tab-system"></div>
  <div id="tab-users" style="display:none"></div>
  <div id="tab-thresholds" style="display:none"></div>
  <div id="tab-shifts" style="display:none"></div>
  <div id="tab-danger" style="display:none"></div>
</div>

<!-- User modal -->
<div class="modal-backdrop" id="user-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="user-modal-title">เพิ่มผู้ใช้</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeUserModal()">✕</button>
    </div>
    <form id="user-form" onsubmit="saveUser(event)">
      <div class="modal-body">
        <input type="hidden" name="id" />
        <div class="grid-2">
          <div class="field">
            <label>Username <span style="color:var(--danger)">*</span></label>
            <input class="input" name="username" required placeholder="manager1" />
          </div>
          <div class="field">
            <label>ชื่อแสดง <span style="color:var(--danger)">*</span></label>
            <input class="input" name="name" required placeholder="สมชาย จัดการดี" />
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label>อีเมล</label>
          <input class="input" type="email" name="email" placeholder="user@example.com" />
        </div>
        <div class="field" style="margin-top:12px">
          <label>บทบาท</label>
          <select class="select" name="role">
            <option value="super">Super Admin — จัดการทุกอย่าง</option>
            <option value="manager">Site Manager — ดูเฉพาะสถานที่ตัวเอง</option>
            <option value="viewer">HR / Viewer — อ่านอย่างเดียว</option>
            <option value="auditor">Auditor — อ่าน + audit log</option>
          </select>
        </div>
        <div class="field" style="margin-top:12px" id="sites-field">
          <label>สถานที่ที่รับผิดชอบ (Site Manager)</label>
          <div class="hint" style="margin-bottom:8px">เว้นว่างไว้ = ทุกสถานที่</div>
          <select class="select" name="sites_select" multiple style="height:120px" id="sites-select"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeUserModal()">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script>
__dbReady.then(() => {
if (!requireAdmin()) return;
  document.getElementById('chrome').innerHTML = renderTopbar('settings');

  // Populate sites select
  DB.locations().forEach(l => {
    document.getElementById('sites-select').insertAdjacentHTML('beforeend',
      `<option value="${l.code}">${l.name} (${l.code})</option>`);
  });

  function switchTab(tab) {
    document.querySelectorAll('.tabs-page button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    ['system','users','thresholds','shifts','danger'].forEach(t => {
      document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
    });
  }

  // ===== SYSTEM TAB =====
  function renderSystem() {
    const s = DB.settings();
    document.getElementById('tab-system').innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <h2 style="margin-bottom:4px">การตรวจซ้ำ (Re-test)</h2>
        <div class="muted small" style="margin-bottom:16px">เมื่อตรวจไม่ผ่าน ระบบจะบังคับรอก่อนตรวจซ้ำ</div>
        <div class="setting-row">
          <div class="setting-label">
            <div class="name">เวลารอตรวจซ้ำ</div>
            <div class="desc">จำนวนนาทีที่ต้องรอก่อนทำการตรวจซ้ำ</div>
          </div>
          <div class="setting-ctrl">
            <div class="row gap-sm">
              <input class="input" type="number" id="retest-min" value="${s.retest_minutes || 5}" min="1" max="60" style="width:80px" />
              <span class="muted">นาที</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h2 style="margin-bottom:4px">Watchlist อัตโนมัติ</h2>
        <div class="muted small" style="margin-bottom:16px">ระบบจะเพิ่มพนักงานเข้า Watchlist อัตโนมัติเมื่อตรวจไม่ผ่านบ่อยครั้ง</div>
        <div class="setting-row">
          <div class="setting-label">
            <div class="name">จำนวนครั้งที่กระตุ้น Watchlist</div>
            <div class="desc">เมื่อตรวจไม่ผ่านครบจำนวนนี้ในช่วงเวลาที่กำหนด</div>
          </div>
          <div class="setting-ctrl">
            <div class="row gap-sm">
              <input class="input" type="number" id="wl-threshold" value="${s.watchlist_threshold || 2}" min="1" max="10" style="width:80px" />
              <span class="muted">ครั้ง</span>
            </div>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <div class="name">ช่วงเวลา Watchlist</div>
            <div class="desc">นับย้อนหลังจากวันนี้</div>
          </div>
          <div class="setting-ctrl">
            <div class="row gap-sm">
              <input class="input" type="number" id="wl-days" value="${s.watchlist_window_days || 30}" min="7" max="365" style="width:80px" />
              <span class="muted">วัน</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h2 style="margin-bottom:4px">ภาษาเริ่มต้น</h2>
        <div class="muted small" style="margin-bottom:16px">ภาษาที่แสดงในฟอร์มผู้ใช้เมื่อเปิดครั้งแรก</div>
        <div class="setting-row">
          <div class="setting-label"><div class="name">ภาษา</div></div>
          <div class="setting-ctrl">
            <select class="select" id="lang-default">
              <option value="th" ${(s.language||'th')==='th'?'selected':''}>ไทย (TH)</option>
              <option value="en" ${s.language==='en'?'selected':''}>English (EN)</option>
              <option value="my" ${s.language==='my'?'selected':''}>မြန်မာ (MY)</option>
              <option value="km" ${s.language==='km'?'selected':''}>ខ្មែរ (KM)</option>
            </select>
          </div>
        </div>
      </div>

      <div style="text-align:right">
        <button class="btn btn-primary" onclick="saveSystem()">💾 บันทึกการตั้งค่า</button>
      </div>
    `;
  }

  function saveSystem() {
    DB.setSettings({
      retest_minutes: parseInt(document.getElementById('retest-min').value) || 5,
      watchlist_threshold: parseInt(document.getElementById('wl-threshold').value) || 2,
      watchlist_window_days: parseInt(document.getElementById('wl-days').value) || 30,
      language: document.getElementById('lang-default').value
    });
    DB.addAudit({ actor_id: currentUser()?.id, actor_name: currentUser()?.name, action: 'update_settings', target: 'system', detail: 'แก้ไขการตั้งค่าระบบ' });
    showToast('บันทึกการตั้งค่าเรียบร้อย', 'success');
  }

  // ===== USERS TAB =====
  function renderUsers() {
    const users = DB.users();
    document.getElementById('tab-users').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div>
            <h2>ผู้ใช้งานระบบ Admin</h2>
            <div class="muted small">${users.length} ผู้ใช้</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openUserModal()">+ เพิ่มผู้ใช้</button>
        </div>
        <div class="table-wrap" style="border:none; border-radius:0">
          <table class="table">
            <thead><tr><th>Username</th><th>ชื่อ</th><th>บทบาท</th><th>สถานที่</th><th>อีเมล</th><th></th></tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td style="font-family:var(--font-mono); font-size:13px; font-weight:600">${u.username}</td>
                  <td>
                    <div class="row gap-sm">
                      <div class="avatar-sm">${u.name.charAt(0)}</div>
                      <span style="font-weight:500">${u.name}</span>
                    </div>
                  </td>
                  <td><span class="role-badge role-${u.role}">${ROLE_LABELS[u.role]?.label || u.role}</span></td>
                  <td class="small muted">${u.sites === 'all' ? 'ทุกสถานที่' : Array.isArray(u.sites) ? u.sites.join(', ') : u.sites}</td>
                  <td class="small muted">${u.email || '—'}</td>
                  <td style="text-align:right">
                    <button class="btn btn-sm" onclick='openUserModal(${JSON.stringify(u).replace(/"/g,"&quot;")})'>แก้ไข</button>
                    <button class="btn btn-sm btn-danger" onclick="delUser('${u.id}')" ${u.id === 'u1' ? 'disabled title="ไม่สามารถลบ Super Admin หลัก"' : ''}>ลบ</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="banner banner-info" style="margin-top:16px">
        <span class="banner-icon">ℹ️</span>
        <div class="small">ใน production ให้เชื่อมระบบ Authentication จริง (เช่น Supabase Auth) แทนการใช้รหัสผ่าน hardcoded</div>
      </div>
    `;
  }

  function openUserModal(u) {
    document.getElementById('user-modal-title').textContent = u ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้';
    const f = document.getElementById('user-form');
    f.reset();
    if (u) {
      f.id.value = u.id;
      f.username.value = u.username;
      f.name.value = u.name;
      f.email.value = u.email || '';
      f.role.value = u.role;
      if (Array.isArray(u.sites)) {
        Array.from(document.getElementById('sites-select').options).forEach(opt => {
          opt.selected = u.sites.includes(opt.value);
        });
      }
    }
    document.getElementById('user-modal').classList.add('show');
  }
  function closeUserModal() { document.getElementById('user-modal').classList.remove('show'); }
  function saveUser(e) {
    e.preventDefault();
    const f = e.target;
    const sel = Array.from(document.getElementById('sites-select').selectedOptions).map(o => o.value);
    const u = {
      username: f.username.value.trim(),
      name: f.name.value.trim(),
      email: f.email.value.trim(),
      role: f.role.value,
      sites: sel.length ? sel : 'all'
    };
    if (f.id.value) u.id = f.id.value;
    DB.upsertUser(u);
    DB.addAudit({ actor_id: currentUser()?.id, actor_name: currentUser()?.name, action: f.id.value ? 'update_user' : 'add_user', target: u.username, detail: `${f.id.value ? 'แก้ไข' : 'เพิ่ม'} ผู้ใช้ ${u.name} (${u.role})` });
    showToast('บันทึกเรียบร้อย');
    closeUserModal();
    renderUsers();
  }
  function delUser(id) {
    if (id === 'u1') { showToast('ไม่สามารถลบ Super Admin หลัก'); return; }
    if (!confirm('ยืนยันการลบผู้ใช้งาน?')) return;
    const u = DB.users().find(x => x.id === id);
    DB.deleteUser(id);
    DB.addAudit({ actor_id: currentUser()?.id, actor_name: currentUser()?.name, action: 'delete_user', target: u?.username || id, detail: `ลบผู้ใช้ ${u?.name || id}` });
    showToast('ลบเรียบร้อย');
    renderUsers();
  }

  // ===== THRESHOLDS TAB =====
  function renderThresholds() {
    document.getElementById('tab-thresholds').innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <h2 style="margin-bottom:4px">เกณฑ์ตัดสินผล (Thai Law Threshold)</h2>
        <div class="muted small" style="margin-bottom:20px">ปรับเปลี่ยนได้ใน production โดยแก้ THRESHOLDS ใน data.js หรือเชื่อม config จาก backend</div>
        ${Object.entries(THRESHOLDS).map(([dept, rules]) => `
          <div style="margin-bottom:20px">
            <div style="font-weight:600; margin-bottom:10px">${dept === 'default' ? 'เกณฑ์ทั่วไป (Default)' : dept}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap">
              ${rules.map(r => `
                <div class="lvl lvl-${r.color === 'success' ? 'pass' : r.color === 'warn' ? 'warn' : r.color === 'danger-strong' ? 'illegal' : 'danger'}" style="padding:6px 14px; font-size:13px">
                  ${r.max === Infinity ? `> 50 mg%` : r.max === 0 ? '0 mg%' : `≤ ${r.max} mg%`} — ${r.label}
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div class="banner banner-info">
        <span class="banner-icon">ℹ️</span>
        <div class="small">เกณฑ์อิงตามกฎหมายไทย พ.ร.บ.จราจรทางบก สำหรับปรับแต่ง threshold แบบ realtime ต้องทำใน admin panel ที่เชื่อมกับ backend</div>
      </div>
    `;
  }

  // ===== SHIFTS TAB =====
  function renderShifts() {
    document.getElementById('tab-shifts').innerHTML = `
      <div class="card">
        <h2 style="margin-bottom:4px">กะทำงาน</h2>
        <div class="muted small" style="margin-bottom:20px">ระบบจะกำหนดกะอัตโนมัติตามเวลาที่ทำการตรวจ</div>
        ${SHIFTS.map(s => `
          <div class="setting-row">
            <div class="setting-label">
              <div class="name">${s.icon} ${s.label}</div>
              <div class="desc" style="font-family:var(--font-mono)">shift_id: ${s.id}</div>
            </div>
            <div class="badge badge-brand">${s.start}:00 – ${s.end % 24}:00</div>
          </div>
        `).join('')}
      </div>
      <div class="banner banner-info" style="margin-top:16px">
        <span class="banner-icon">ℹ️</span>
        <div class="small">กะทำงานกำหนดไว้ใน data.js ผ่านค่า SHIFTS — แก้ไขค่าเพื่อปรับเวลากะ</div>
      </div>
    `;
  }

  // ===== DANGER TAB =====
  function renderDanger() {
    document.getElementById('tab-danger').innerHTML = `
      <div class="banner banner-danger" style="margin-bottom:16px">
        <span class="banner-icon">☢️</span>
        <div><b>โซนอันตราย</b><br><span class="small">การดำเนินการในส่วนนี้ไม่สามารถย้อนกลับได้</span></div>
      </div>
      <div class="card">
        <div class="setting-row">
          <div class="setting-label">
            <div class="name">รีเซ็ตข้อมูลทั้งหมด</div>
            <div class="desc">ลบข้อมูลทั้งหมดใน localStorage และโหลดข้อมูลตัวอย่างใหม่</div>
          </div>
          <button class="btn btn-danger" onclick="doReset()">รีเซ็ตข้อมูล</button>
        </div>
        <div class="setting-row">
          <div class="setting-label">
            <div class="name">Export ข้อมูลทั้งหมด (JSON)</div>
            <div class="desc">ดาวน์โหลดข้อมูลทั้งหมดเป็น JSON สำหรับสำรองข้อมูล</div>
          </div>
          <button class="btn" onclick="exportAll()">📥 Export JSON</button>
        </div>
      </div>
    `;
  }

  function doReset() {
    if (!confirm('ยืนยัน: รีเซ็ตข้อมูลทั้งหมดเป็นค่าเริ่มต้น? การกระทำนี้ไม่สามารถย้อนกลับได้')) return;
    resetDB();
    showToast('รีเซ็ตข้อมูลเรียบร้อย');
    setTimeout(() => location.reload(), 800);
  }
  function exportAll() {
    const data = JSON.stringify(loadDB(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `alcohol-db-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    showToast('Export เรียบร้อย');
  }

  Object.assign(window, { switchTab, saveSystem, openUserModal, closeUserModal, saveUser, delUser, doReset, exportAll });
  renderSystem();
  renderUsers();
  renderThresholds();
  renderShifts();
  renderDanger();
});
</script>
</body>
</html>
