<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เครื่องตรวจแอลกอฮอล์ — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  .device-status { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .status-active { background:var(--success-soft); color:var(--success); }
  .status-due-soon { background:var(--warn-soft); color:var(--warn); }
  .status-overdue { background:var(--danger-soft); color:var(--danger); }
  .status-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:24px">
    <div>
      <h1 id="page-title"></h1>
      <div class="muted small" id="meta"></div>
    </div>
    <div class="row gap-sm">
      <button class="btn btn-ghost btn-sm" id="template-btn" onclick="downloadTemplate()"></button>
      <button class="btn btn-ghost btn-sm" id="export-btn" onclick="exportCSV()"></button>
      <button class="btn btn-ghost btn-sm" id="import-btn" onclick="document.getElementById('csv-input').click()"></button>
      <input type="file" id="csv-input" accept=".csv,text/csv" style="display:none" onchange="importCSV(this)" />
      <button class="btn btn-primary" id="add-dev-btn" onclick="openModal()"></button>
    </div>
  </div>

  <div id="banners"></div>

  <div class="stats" style="margin-bottom:24px" id="stats"></div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Serial No.</th>
          <th id="th-asset"></th>
          <th id="th-model"></th>
          <th id="th-location"></th>
          <th id="th-last-cal"></th>
          <th id="th-next-cal"></th>
          <th id="th-status"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <form id="form" onsubmit="save(event)">
      <div class="modal-body">
        <input type="hidden" name="id" />
        <div class="grid-2">
          <div class="field">
            <label>Serial No. <span style="color:var(--danger)">*</span></label>
            <input class="input" name="serial" required placeholder="BT-AL7-0001" />
          </div>
          <div class="field">
            <label id="lbl-asset"></label>
            <input class="input" name="asset_no" placeholder="AST-00001" />
          </div>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="field">
            <label id="lbl-model"></label>
            <input class="input" name="model" required placeholder="AlcoSense AL7000" />
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label id="lbl-loc"></label>
          <select class="select" name="location_code">
            <option value="" id="opt-no-loc"></option>
          </select>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="field">
            <label id="lbl-last-cal"></label>
            <input class="input" type="date" name="last_calibrated" />
          </div>
          <div class="field">
            <label id="lbl-next-cal"></label>
            <input class="input" type="date" name="next_calibration" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="modal-cancel-btn" onclick="closeModal()"></button>
        <button type="submit" class="btn btn-primary" id="modal-save-btn"></button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (requireAdmin()) {
  document.getElementById('chrome').innerHTML = renderTopbar('devices');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';
  const canMutate = hasRole('super', 'manager');

  document.getElementById('page-title').textContent = isEN ? 'Alcohol Test Devices' : 'เครื่องตรวจแอลกอฮอล์';
  document.getElementById('add-dev-btn').textContent = isEN ? '+ Add Device' : '+ เพิ่มเครื่องตรวจ';
  document.getElementById('template-btn').textContent = isEN ? '📋 Template' : '📋 Template';
  document.getElementById('export-btn').textContent = isEN ? '📤 Export CSV' : '📤 Export CSV';
  document.getElementById('import-btn').textContent = isEN ? '📥 Import CSV' : '📥 Import CSV';
  if (!canMutate) document.getElementById('import-btn').style.display = 'none';
  document.getElementById('th-asset').textContent = 'Asset No.';
  document.getElementById('lbl-asset').textContent = 'Asset No.';
  document.getElementById('th-model').textContent = isEN ? 'Model' : 'รุ่น';
  document.getElementById('th-location').textContent = isEN ? 'Location' : 'สถานที่';
  document.getElementById('th-last-cal').textContent = isEN ? 'Last Calibrated' : 'สอบเทียบล่าสุด';
  document.getElementById('th-next-cal').textContent = isEN ? 'Next Calibration' : 'สอบเทียบครั้งต่อไป';
  document.getElementById('th-status').textContent = isEN ? 'Status' : 'สถานะ';
  document.getElementById('lbl-model').innerHTML = `${isEN ? 'Model / Brand' : 'รุ่น / ยี่ห้อ'} <span style="color:var(--danger)">*</span>`;
  document.getElementById('lbl-loc').textContent = isEN ? 'Assigned Location' : 'สถานที่ประจำ';
  document.getElementById('opt-no-loc').textContent = isEN ? '-- Not specified --' : '-- ไม่ระบุ --';
  document.getElementById('lbl-last-cal').textContent = isEN ? 'Last Calibration Date' : 'วันที่สอบเทียบล่าสุด';
  document.getElementById('lbl-next-cal').textContent = isEN ? 'Next Calibration Date' : 'วันที่สอบเทียบครั้งต่อไป';
  document.getElementById('modal-cancel-btn').textContent = isEN ? 'Cancel' : 'ยกเลิก';
  document.getElementById('modal-save-btn').textContent = isEN ? 'Save' : 'บันทึก';

  // Populate location select
  DB.locations().forEach(l => {
    document.querySelector('[name=location_code]').insertAdjacentHTML('beforeend',
      `<option value="${esc(l.code)}">${esc(l.name)} (${esc(l.code)})</option>`);
  });

  function statusBadge(status) {
    const map = isEN ? {
      active: ['status-active', '● Normal'],
      'due-soon': ['status-due-soon', '⚠ Expiring Soon'],
      overdue: ['status-overdue', '✕ Overdue']
    } : {
      active: ['status-active', '● ปกติ'],
      'due-soon': ['status-due-soon', '⚠ ใกล้หมด'],
      overdue: ['status-overdue', '✕ เกินกำหนด']
    };
    const [cls, label] = map[status] || map.active;
    return `<span class="device-status ${cls}"><span class="status-dot"></span>${label}</span>`;
  }

  function daysUntil(dateStr) {
    const d = (new Date(dateStr) - Date.now()) / 86400000;
    return Math.round(d);
  }

  function render() {
    const devices = DB.devices();
    const overdue = devices.filter(d => getDeviceStatus(d.next_calibration) === 'overdue');
    const dueSoon = devices.filter(d => getDeviceStatus(d.next_calibration) === 'due-soon');

    document.getElementById('meta').textContent = `${devices.length} ${isEN ? 'devices' : 'เครื่อง'}`;
    document.getElementById('stats').innerHTML = `
      <div class="stat accent-blue"><div class="label">${isEN ? 'All' : 'ทั้งหมด'}</div><div class="value">${devices.length}</div><div class="delta">${isEN ? 'Registered in system' : 'ลงทะเบียนในระบบ'}</div></div>
      <div class="stat accent-green"><div class="label">${isEN ? 'Normal' : 'ปกติ'}</div><div class="value">${devices.filter(d=>getDeviceStatus(d.next_calibration)==='active').length}</div></div>
      <div class="stat" style="border-color:#fcd34d"><div class="label" style="color:var(--warn)">${isEN ? 'Expiring Soon' : 'ใกล้หมดอายุ'}</div><div class="value" style="color:var(--warn)">${dueSoon.length}</div><div class="delta">${isEN ? 'Within 30 days' : 'ภายใน 30 วัน'}</div></div>
      <div class="stat accent-red"><div class="label">${isEN ? 'Overdue' : 'เกินกำหนด'}</div><div class="value">${overdue.length}</div><div class="delta">${isEN ? 'Urgent calibration needed' : 'ต้องสอบเทียบด่วน'}</div></div>
    `;

    const banners = document.getElementById('banners');
    let b = '';
    if (overdue.length) b += isEN
      ? `<div class="banner banner-danger" style="margin-bottom:12px"><span class="banner-icon">🚨</span><div><b>${overdue.length} device(s) overdue for calibration</b><br><span class="small">${overdue.map(d => esc(d.serial)).join(', ')} — must be sent for calibration immediately, do not use</span></div></div>`
      : `<div class="banner banner-danger" style="margin-bottom:12px"><span class="banner-icon">🚨</span><div><b>เครื่องตรวจ ${overdue.length} เครื่องเกินกำหนดสอบเทียบ</b><br><span class="small">${overdue.map(d => esc(d.serial)).join(', ')} — ต้องส่งสอบเทียบทันที ห้ามใช้งาน</span></div></div>`;
    if (dueSoon.length) b += isEN
      ? `<div class="banner banner-warn" style="margin-bottom:12px"><span class="banner-icon">⚠️</span><div><b>${dueSoon.length} device(s) calibration expiring soon</b><br><span class="small">${dueSoon.map(d => `${esc(d.serial)} (${daysUntil(d.next_calibration)} days left)`).join(', ')}</span></div></div>`
      : `<div class="banner banner-warn" style="margin-bottom:12px"><span class="banner-icon">⚠️</span><div><b>เครื่องตรวจ ${dueSoon.length} เครื่องใกล้หมดอายุสอบเทียบ</b><br><span class="small">${dueSoon.map(d => `${esc(d.serial)} (อีก ${daysUntil(d.next_calibration)} วัน)`).join(', ')}</span></div></div>`;
    banners.innerHTML = b;

    const locs = DB.locations().reduce((m, l) => { m[l.code] = l.name; return m; }, {});
    document.getElementById('rows').innerHTML = devices.length ? devices.map(d => {
      const st = getDeviceStatus(d.next_calibration);
      const daysLeft = daysUntil(d.next_calibration);
      return `
        <tr>
          <td style="font-family:var(--font-mono); font-size:13px; font-weight:600">${esc(d.serial)}</td>
          <td class="small" style="font-family:var(--font-mono); font-size:12px">${d.asset_no ? esc(d.asset_no) : '<span class="muted">—</span>'}</td>
          <td class="small">${esc(d.model)}</td>
          <td class="small">${d.location_code ? `<span style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted)">${esc(d.location_code)}</span> ${esc(locs[d.location_code] || '')}` : '<span class="muted">—</span>'}</td>
          <td class="small">${d.last_calibrated || '—'}</td>
          <td class="small">
            ${d.next_calibration || '—'}
            ${d.next_calibration ? `<div class="tiny ${daysLeft < 0 ? 'muted' : daysLeft < 30 ? '' : 'muted'}" style="color:${daysLeft < 0 ? 'var(--danger)' : daysLeft < 30 ? 'var(--warn)' : 'var(--text-muted)'}">${daysLeft < 0 ? (isEN ? `${Math.abs(daysLeft)} days overdue` : `เกิน ${Math.abs(daysLeft)} วัน`) : (isEN ? `${daysLeft} days left` : `อีก ${daysLeft} วัน`)}</div>` : ''}
          </td>
          <td>${statusBadge(st)}</td>
          <td style="text-align:right">
            <button class="btn btn-sm" data-edit-id="${esc(d.id)}">${isEN ? 'Edit' : 'แก้ไข'}</button>
            <button class="btn btn-sm btn-danger" data-del-id="${esc(d.id)}">${isEN ? 'Delete' : 'ลบ'}</button>
          </td>
        </tr>
      `;
    }).join('') : `<tr><td colspan="8"><div class="empty"><div class="icon">🔬</div>${isEN ? 'No devices yet' : 'ยังไม่มีเครื่องตรวจ'}</div></td></tr>`;
    // data-* + delegation avoids JSON.stringify into onclick='openModal(${...})',
    // where an apostrophe in user data would break out of the JS string.
    const rows = document.getElementById('rows');
    rows.querySelectorAll('button[data-edit-id]').forEach(b => b.addEventListener('click', () => {
      const d = DB.devices().find(x => x.id === b.getAttribute('data-edit-id'));
      if (d) openModal(d);
    }));
    rows.querySelectorAll('button[data-del-id]').forEach(b => b.addEventListener('click', () => del(b.getAttribute('data-del-id'))));
  }

  function openModal(d) {
    document.getElementById('modal-title').textContent = d ? (isEN ? 'Edit Device' : 'แก้ไขเครื่องตรวจ') : (isEN ? 'Add Device' : 'เพิ่มเครื่องตรวจ');
    const f = document.getElementById('form');
    f.reset();
    if (d) {
      f.id.value = d.id;
      f.serial.value = d.serial;
      f.asset_no.value = d.asset_no || '';
      f.model.value = d.model;
      f.location_code.value = d.location_code || '';
      f.last_calibrated.value = d.last_calibrated || '';
      f.next_calibration.value = d.next_calibration || '';
    }
    document.getElementById('modal').classList.add('show');
  }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }
  function save(e) {
    e.preventDefault();
    if (!canMutate) return;
    const f = e.target;
    const d = {
      serial: f.serial.value.trim(),
      asset_no: f.asset_no.value.trim(),
      model: f.model.value.trim(),
      location_code: f.location_code.value || '',
      last_calibrated: f.last_calibrated.value || '',
      next_calibration: f.next_calibration.value || '',
      status: f.next_calibration.value ? getDeviceStatus(f.next_calibration.value) : 'active'
    };
    if (f.id.value) d.id = f.id.value;
    DB.upsertDevice(d);
    showToast(f.id.value ? (isEN ? 'Updated' : 'แก้ไขเรียบร้อย') : (isEN ? 'Added' : 'เพิ่มเรียบร้อย'));
    closeModal();
    render();
  }
  function del(id) {
    if (!canMutate) return;
    if (!confirm(isEN ? 'Confirm delete this device?' : 'ยืนยันการลบเครื่องตรวจ?')) return;
    DB.deleteDevice(id);
    showToast(isEN ? 'Deleted' : 'ลบเรียบร้อย');
    render();
  }

  const CSV_HEADERS = ['serial', 'asset_no', 'model', 'location_code', 'last_calibrated', 'next_calibration'];
  function csvEsc(v) { const s = String(v ?? ''); return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s; }

  function downloadTemplate() {
    const ex = ['BT-AL7-0001', 'AST-00001', 'AlcoSense AL7000', 'LOC001', '2026-01-15', '2027-01-15'];
    triggerDownload([CSV_HEADERS.join(','), ex.map(csvEsc).join(',')].join('\r\n'), 'device_template.csv');
  }
  function exportCSV() {
    const devs = DB.devices();
    if (!devs.length) { showToast(isEN ? 'No data to export' : 'ไม่มีข้อมูลให้ Export'); return; }
    const rows = [CSV_HEADERS.join(','), ...devs.map(d => CSV_HEADERS.map(h => csvEsc(d[h])).join(','))];
    triggerDownload(rows.join('\r\n'), `devices_${new Date().toISOString().slice(0,10)}.csv`);
    showToast(isEN ? `Exported ${devs.length} devices` : `Export ${devs.length} เครื่องแล้ว`);
  }
  function triggerDownload(content, filename) {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob(['﻿'+content], {type:'text/csv;charset=utf-8;'})), download: filename });
    a.click(); URL.revokeObjectURL(a.href);
  }
  function importCSV(input) {
    if (!canMutate || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const lines = e.target.result.replace(/\r/g,'').split('\n').filter(l => l.trim());
        const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
        const serialCol = header.indexOf('serial');
        if (serialCol < 0) { showToast(isEN ? 'CSV missing required column: serial' : 'CSV ขาดคอลัมน์: serial'); return; }
        const parse = (line) => {
          const cols = []; let cur = ''; let inQ = false;
          for (let i = 0; i < line.length; i++) {
            if (line[i]==='"' && !inQ) inQ=true;
            else if (line[i]==='"' && inQ && line[i+1]==='"') { cur+='"'; i++; }
            else if (line[i]==='"' && inQ) inQ=false;
            else if (line[i]===',' && !inQ) { cols.push(cur.trim()); cur=''; }
            else cur+=line[i];
          }
          cols.push(cur.trim()); return cols;
        };
        const get = (cols, key) => { const i = header.indexOf(key); return i >= 0 ? (cols[i]||'').trim() : ''; };
        let imported = 0, skipped = 0;
        const promises = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = parse(lines[i]);
          const serial = get(cols, 'serial');
          const model = get(cols, 'model');
          if (!serial) { skipped++; continue; }
          const existing = DB.devices().find(d => d.serial === serial);
          promises.push(DB.upsertDevice({
            ...(existing ? { id: existing.id } : {}),
            serial, model: model || existing?.model || '', asset_no: get(cols,'asset_no'),
            location_code: get(cols,'location_code'), last_calibrated: get(cols,'last_calibrated'),
            next_calibration: get(cols,'next_calibration')
          }));
          imported++;
        }
        await Promise.all(promises);
        input.value = '';
        DB._initialized = false;
        await DB.init();
        render();
        showToast(isEN ? `Imported ${imported} devices${skipped?`, skipped ${skipped}`:''}` : `Import ${imported} เครื่อง${skipped?` (ข้าม ${skipped})`:''}  เสร็จแล้ว`);
      } catch (err) {
        showToast((isEN ? 'Import failed: ' : 'นำเข้าไม่สำเร็จ: ') + (err.message || err));
        input.value = '';
      }
    };
    reader.readAsText(input.files[0], 'UTF-8');
  }

  Object.assign(window, { openModal, closeModal, save, del, downloadTemplate, exportCSV, importCSV });
  render();
  DB.startPolling(render, 5000);
}
}); // DB.init
</script>
</body>
</html>
