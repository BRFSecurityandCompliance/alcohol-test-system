<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>กรอกผลตรวจแอลกอฮอล์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--surface-2); }
  .lock-pill { background: rgba(255,255,255,.16); color:#fff; display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .invalid-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .invalid-card { max-width: 420px; width: 100%; text-align: center; }
  .invalid-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; font-size: 36px; margin: 0 auto 20px; }
  .combo-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow-md); max-height: 240px; overflow-y: auto; z-index: 50; }
  .combo-item { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); }
  .combo-item:last-child { border-bottom: none; }
  .combo-item:hover, .combo-item.active { background: var(--brand-soft); color: var(--brand); }
  .combo-item .new-label { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--success-soft); color: var(--success); margin-left: 6px; font-weight: 600; }
  .combo-empty { padding: 14px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .quick-card { background: linear-gradient(135deg, var(--brand-soft), #fff); border: 1px solid #c7d2fe; padding: 14px; border-radius: var(--r-md); margin-bottom: 12px; }
  .threshold-preview { padding:14px; border-radius:var(--r-md); margin-top:12px; font-size:13px; display:flex; gap:10px; align-items:flex-start; }
  .tp-pass { background:var(--success-soft); color:var(--success); }
  .tp-warn { background:var(--warn-soft); color:#92400e; }
  .tp-danger { background:var(--danger-soft); color:#7f1d1d; }
  .tp-illegal { background:#3b0a0a; color:#fff; }
</style>
</head>
<body>
<div id="net-status"></div>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
const params = new URLSearchParams(location.search);
const locationCode = params.get('location');
const loc = locationCode ? DB.findLocation(locationCode) : null;
const retestOf = params.get('retest_of') || null;
const retestSource = retestOf ? DB.tests().find(t => t.id === retestOf) : null;

// Network status
function updateNet() {
  const el = document.getElementById('net-status');
  const lang = localStorage.getItem('lang') || 'th';
  const Tg = (k) => t(k, lang);
  if (!navigator.onLine) {
    el.innerHTML = `<div class="net-pill offline">${Tg('offline')}</div>`;
  } else {
    const q = getOfflineQueue().length;
    if (q > 0) {
      const synced = flushOfflineQueue();
      el.innerHTML = `<div class="net-pill online">${Tg('online_pre')}${synced}${Tg('online_suf')}</div>`;
      setTimeout(() => el.innerHTML = '', 3000);
    } else { el.innerHTML = ''; }
  }
}
window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);
updateNet();

const app = document.getElementById('app');

if (!locationCode || !loc) {
  const lang0 = localStorage.getItem('lang') || 'th';
  const T0 = (k) => t(k, lang0);
  const lb = {th:'TH',en:'EN',my:'MM',km:'KH'};
  app.innerHTML = `
    <div class="invalid-screen">
      <div style="display:flex; justify-content:center; gap:6px; padding:16px 0 0">
        ${['th','en','my','km'].map(l=>`<button data-l="${l}" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;background:${lang0===l?'var(--brand)':'var(--surface)'};color:${lang0===l?'#fff':'var(--text)'};cursor:pointer" onclick="localStorage.setItem('lang','${l}');location.reload()">${lb[l]}</button>`).join('')}
      </div>
      <div class="card invalid-card">
        <div class="invalid-icon">⚠</div>
        <h1 style="margin-bottom:8px">${T0('invalid_title')}</h1>
        <p class="muted" style="margin:0 0 20px">${T0('invalid_msg')}</p>
        <a href="index.html" class="btn btn-block">${T0('back_home')}</a>
      </div>
    </div>`;
} else {
  renderForm();
}

function renderForm() {
  const lang = localStorage.getItem('lang') || 'th';
  const T = (k) => t(k, lang);
  const device = DB.devices().find(d => d.location_code === loc.code);

  const retestBanner = retestSource ? `
    <div class="banner banner-warn" style="margin:12px 16px 0">
      <span class="banner-icon">🔁</span>
      <div>
        <b>${T('retest_title')}</b><br>
        ${T('retest_for')} <b>${retestSource.full_name}</b> ${T('retest_first')} ${retestSource.alcohol_value} mg% ${T('retest_time')} ${formatTime(retestSource.created_at)}
      </div>
    </div>` : '';

  app.innerHTML = `
    <div class="mobile-shell">
      <div class="mobile-header">
        <div class="row between" style="margin-bottom:8px">
          <span class="lock-pill">${T('qr_locked')}</span>
          <span class="tiny" style="color:rgba(255,255,255,.7); font-family:var(--font-mono)">${loc.code}</span>
        </div>
        <h1>${loc.name}</h1>
        <div class="small" style="color:rgba(255,255,255,.8); margin-top:4px">${loc.address || ''}</div>
        ${device ? `<div class="tiny" style="color:rgba(255,255,255,.65); margin-top:8px; font-family:var(--font-mono)">${T('device_prefix')} ${device.serial}</div>` : ''}
      </div>
      ${retestBanner}
      <div class="mobile-body">
        <div class="row between" style="margin-bottom:14px">
          <h2 style="margin:0">${T('record')}</h2>
          <div class="lang-switch" id="lang-switch">
            ${(function(){const lb={th:'TH',en:'EN',my:'MM',km:'KH'};return['th','en','my','km'].map(l=>`<button data-l="${l}" class="${lang===l?'active':''}">${lb[l]}</button>`).join('');})()}
          </div>
        </div>
        <p class="muted small" style="margin:0 0 16px">${T('fill_in')}</p>

        <!-- Quick employee lookup -->
        <div class="quick-card">
          <div class="row gap-sm" style="margin-bottom:8px">
            <span style="font-size:18px">⚡</span>
            <b>${T('quick_lookup')}</b>
          </div>
          <div class="row gap-sm">
            <input class="input" id="emp-id" placeholder="${T('employee_id')} (เช่น EMP001)" style="flex:1" value="${retestSource?.employee_id || ''}" />
            <button class="btn btn-primary" id="emp-lookup">${T('search')}</button>
          </div>
          <div class="tiny muted" style="margin-top:6px">${T('quick_hint')}</div>
        </div>

        <form id="form" class="col gap-md">
          <div class="field">
            <label>${T('full_name')} <span style="color:var(--danger)">*</span></label>
            <input class="input" name="full_name" required value="${retestSource?.full_name || ''}" placeholder="เช่น สมชาย ใจดี" />
          </div>

          <div class="field">
            <label>${T('department')} <span style="color:var(--danger)">*</span></label>
            <select class="select" name="department" required>
              <option value="">${T('select_dept')}</option>
              ${DEPARTMENTS.map(d => `<option value="${d}" ${retestSource?.department===d?'selected':''}>${d}</option>`).join('')}
            </select>
          </div>

          <div class="field" id="plate-field" style="display:${retestSource && PLATE_REQUIRED_DEPTS.includes(retestSource.department) ? 'flex':'none'}">
            <label>${T('plate')} <span style="color:var(--danger)">*</span></label>
            <input class="input" name="plate_number" placeholder="เช่น 1กก-1234" value="${retestSource?.plate_number || ''}" />
          </div>

          <div class="field">
            <label>${T('company')} <span style="color:var(--danger)">*</span></label>
            <div class="combo" id="company-combo" style="position:relative">
              <input class="input" name="company" id="company-input" autocomplete="off" placeholder="${T('company_placeholder')}" required value="${retestSource?.company || ''}" />
              <div id="company-list" class="combo-list" style="display:none"></div>
            </div>
          </div>

          <div class="field">
            <label>${T('result')} <span style="color:var(--danger)">*</span></label>
            <div class="toggle-row" id="zero-toggle">
              <div class="seg zero" data-zero="true">
                <div style="font-size:18px">0%</div>
                <div class="tiny" style="font-weight:500; opacity:.85; margin-top:2px">${T('no_alcohol')}</div>
              </div>
              <div class="seg positive" data-zero="false">
                <div style="font-size:18px">> 0%</div>
                <div class="tiny" style="font-weight:500; opacity:.85; margin-top:2px">${T('has_alcohol')}</div>
              </div>
            </div>
          </div>

          <div class="field" id="value-field" style="display:none">
            <label>${T('value_mg')} <span style="color:var(--danger)">*</span></label>
            <input class="input" name="alcohol_value" type="number" step="0.1" min="0.1" placeholder="เช่น 25" />
            <div id="threshold-preview"></div>
          </div>

          <div class="field">
            <label>${T('photo_label')} <span style="color:var(--danger)">*</span></label>
            <div class="photo-slot" id="photo-slot">
              <div class="placeholder">
                <span class="icon">📷</span>
                <div>${T('take_photo')}</div>
                <div class="tiny" style="margin-top:4px">${T('camera_only')}</div>
              </div>
              <input type="file" name="photo" accept="image/*" capture="environment" style="position:absolute; inset:0; opacity:0; cursor:pointer" />
            </div>
          </div>

          <!-- Signature removed -->

          <div class="divider"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" disabled id="submit-btn">${T('submit')}</button>
          <div style="text-align:center; margin-top:8px">
            <a href="${lang === 'th' ? 'https://bevchain.co.th/th/pdpa-policy-th/' : 'https://bevchain.co.th/pdpa-policy/'}" target="_blank" rel="noopener noreferrer" class="tiny" style="color:var(--text-muted); text-decoration:underline; text-underline-offset:2px">🔐 ${T('pdpa')}</a>
          </div>
        </form>
      </div>
    </div>`;

  // Lang switcher
  document.getElementById('lang-switch').addEventListener('click', e => {
    const b = e.target.closest('button[data-l]'); if (!b) return;
    localStorage.setItem('lang', b.dataset.l); location.reload();
  });

  let isZero = retestSource ? retestSource.is_zero : null;
  const form = document.getElementById('form');
  const plateField = document.getElementById('plate-field');
  const valueField = document.getElementById('value-field');
  const submitBtn = document.getElementById('submit-btn');
  const photoSlot = document.getElementById('photo-slot');
  const photoInput = photoSlot.querySelector('input[type=file]');
  const tpEl = document.getElementById('threshold-preview');
  let photoData = null;

  // Employee quick lookup
  document.getElementById('emp-lookup').onclick = () => {
    const id = document.getElementById('emp-id').value.trim();
    if (!id) return;
    const p = DB.findPerson(id);
    if (!p) { showToast(T('emp_not_found') + ' ' + id); return; }
    form.full_name.value = p.full_name;
    form.department.value = p.department;
    form.company.value = p.company;
    if (p.plate_number) {
      form.plate_number.value = p.plate_number;
      plateField.style.display = 'flex';
    }
    showToast(T('emp_loaded') + ': ' + p.full_name);
    updateThresholdPreview();
    validate();
  };

  // Toggle 0% / Positive
  document.querySelectorAll('#zero-toggle .seg').forEach(seg => {
    seg.addEventListener('click', () => {
      document.querySelectorAll('#zero-toggle .seg').forEach(s => s.classList.remove('active'));
      seg.classList.add('active');
      isZero = seg.dataset.zero === 'true';
      valueField.style.display = isZero ? 'none' : 'flex';
      const valueInput = form.querySelector('[name=alcohol_value]');
      if (isZero) { valueInput.value=''; valueInput.removeAttribute('required'); tpEl.innerHTML=''; }
      else { valueInput.setAttribute('required',''); }
      validate();
    });
  });

  // Department -> plate
  form.department.addEventListener('change', () => {
    const needs = PLATE_REQUIRED_DEPTS.includes(form.department.value);
    plateField.style.display = needs ? 'flex' : 'none';
    const p = form.querySelector('[name=plate_number]');
    if (needs) p.setAttribute('required',''); else { p.removeAttribute('required'); p.value=''; }
    updateThresholdPreview();
    validate();
  });

  // Threshold preview
  function updateThresholdPreview() {
    const v = parseFloat(form.alcohol_value.value);
    if (!v || isZero) { tpEl.innerHTML = ''; return; }
    const lvl = getThresholdLevel(v, form.department.value);
    const cls = 'tp-' + (lvl.color === 'success' ? 'pass' : lvl.color === 'warn' ? 'warn' : lvl.color === 'danger-strong' ? 'illegal' : 'danger');
    const advice = lvl.level === 'pass' ? T('tp_pass') : lvl.level === 'caution' ? T('tp_caution') : lvl.level === 'no-drive' ? T('tp_nodrive') : T('tp_illegal');
    tpEl.innerHTML = `<div class="threshold-preview ${cls}"><span style="font-size:18px">${lvl.color==='success'?'✓':'⚠'}</span><div><b>${T('tp_level')} ${lvl.label}</b><br><span class="tiny">${advice}</span></div></div>`;
  }
  form.alcohol_value.addEventListener('input', updateThresholdPreview);

  // Photo with stamp
  async function stampPhoto(dataUrl) {
    // Ensure fonts are loaded before drawing to canvas
    await Promise.allSettled([
      document.fonts.load('bold 28px Sarabun'),
      document.fonts.load('500 22px Sarabun')
    ]);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1280, scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        // Dark gradient bar at top
        const barH = Math.max(130, Math.round(h * 0.14));
        const g = ctx.createLinearGradient(0, 0, 0, barH);
        g.addColorStop(0, 'rgba(0,0,0,0.80)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, barH);

        // Scale font size relative to image width so stamp is readable on any resolution
        const fs1 = Math.max(20, Math.round(w * 0.022));
        const fs2 = Math.max(16, Math.round(w * 0.017));
        const pad = Math.round(w * 0.016);
        const now = new Date();
        const dateStr = now.toLocaleString('th-TH', {
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });

        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = Math.round(w * 0.004);
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'top';
        ctx.font = `bold ${fs1}px Sarabun, Arial, sans-serif`;
        ctx.fillText(dateStr, pad, Math.round(barH * 0.18));
        ctx.font = `${fs2}px Sarabun, Arial, sans-serif`;
        ctx.fillText(`📍 ${loc.name} (${loc.code})`, pad, Math.round(barH * 0.18 + fs1 * 1.4));
        ctx.shadowBlur = 0;

        resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.src = dataUrl;
    });
  }
  async function uploadPhotoToStorage(dataUrl) {
    try {
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const filename = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
      const { data, error } = await _sb.storage.from('test-photos').upload(filename, blob, { contentType: 'image/jpeg', upsert: false });
      if (error) throw error;
      const { data: urlData } = _sb.storage.from('test-photos').getPublicUrl(data.path);
      return urlData.publicUrl;
    } catch {
      return null; // fall back to base64 on failure
    }
  }

  photoInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) {
      showToast(T('camera_only'));
      return;
    }
    const r = new FileReader();
    r.onload = async ev => {
      photoData = await stampPhoto(ev.target.result);
      photoSlot.querySelector('.placeholder')?.remove();
      photoSlot.querySelector('img')?.remove();
      const img = document.createElement('img');
      img.onload = () => { photoSlot.style.aspectRatio = `${img.naturalWidth}/${img.naturalHeight}`; };
      img.src = photoData;
      photoSlot.appendChild(img);
      validate();
    };
    r.onerror = () => showToast(T('camera_only'));
    r.readAsDataURL(f);
  });

  // Company combo
  const ci = document.getElementById('company-input'), cl = document.getElementById('company-list');
  function rL(q) {
    const all = DB.companies().map(c => c.name);
    const f = q ? all.filter(n => n.toLowerCase().includes(q.toLowerCase())) : all;
    let html = f.map(n => `<div class="combo-item" data-val="${n.replace(/"/g,'&quot;')}">${n}</div>`).join('');
    if (q && !all.some(n => n.toLowerCase()===q.toLowerCase())) html += `<div class="combo-item" data-val="${q.replace(/"/g,'&quot;')}">${T('company_use')} "${q}"<span class="new-label">${T('company_new_badge')}</span></div>`;
    if (!html) html = `<div class="combo-empty">${T('company_new')}</div>`;
    cl.innerHTML = html; cl.style.display='block';
    cl.querySelectorAll('.combo-item').forEach(el => el.addEventListener('mousedown', () => { ci.value = el.dataset.val; cl.style.display='none'; validate(); }));
  }
  ci.addEventListener('focus', () => rL(ci.value));
  ci.addEventListener('input', () => rL(ci.value));
  ci.addEventListener('blur', () => setTimeout(() => cl.style.display='none', 150));

  ['input','change'].forEach(evt => form.addEventListener(evt, validate));

  function validate() {
    const ok = form.full_name.value && form.department.value && form.company.value && isZero !== null && photoData;
    const plateOk = !PLATE_REQUIRED_DEPTS.includes(form.department.value) || form.plate_number.value;
    const valueOk = isZero === true || (isZero === false && parseFloat(form.alcohol_value.value) > 0);
    submitBtn.disabled = !(ok && plateOk && valueOk);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ ' + T('submit');

    let photoUrl = photoData; // default: base64 (used for offline)
    let savedOffline = false;

    if (!navigator.onLine) {
      // Keep base64 in offline queue — will be stored as-is when flushed
      const payload = {
        employee_id: document.getElementById('emp-id').value || '',
        full_name: form.full_name.value,
        department: form.department.value,
        plate_number: form.plate_number.value || '',
        company: form.company.value,
        alcohol_value: isZero ? 0 : parseFloat(form.alcohol_value.value),
        is_zero: isZero,
        location_code: loc.code,
        location_name: loc.name,
        photo_url: photoUrl,
        device_serial: device?.serial || '',
        retest_of: retestOf,
        created_at: new Date().toISOString()
      };
      pushOfflineQueue(payload);
      savedOffline = true;
    } else {
      // Upload photo to Supabase Storage first
      const uploaded = await uploadPhotoToStorage(photoData);
      if (uploaded) photoUrl = uploaded;

      const payload = {
        employee_id: document.getElementById('emp-id').value || '',
        full_name: form.full_name.value,
        department: form.department.value,
        plate_number: form.plate_number.value || '',
        company: form.company.value,
        alcohol_value: isZero ? 0 : parseFloat(form.alcohol_value.value),
        is_zero: isZero,
        location_code: loc.code,
        location_name: loc.name,
        photo_url: photoUrl,
        device_serial: device?.serial || '',
        retest_of: retestOf
      };
      const newTest = DB.addTest(payload);
      // Wait for Supabase INSERT to complete (max 5s) before navigating away
      await Promise.race([newTest._sync, new Promise(r => setTimeout(r, 5000))]);
      // Mark original as completed if this was a retest
      if (retestOf) DB.updateTest(retestOf, { retest_status: 'completed' });
      // Trigger retest flow if not zero
      if (!isZero && !retestOf) {
        const lvl = getThresholdLevel(payload.alcohol_value, payload.department);
        if (lvl.level !== 'pass') {
          DB.updateTest(newTest.id, { retest_status: 'required' });
          location.href = `user-retest.html?test_id=${newTest.id}`;
          return;
        }
      }
    }
    location.href = `user-success.html?location=${loc.code}&zero=${isZero}${savedOffline ? '&offline=1' : ''}`;
  });
}
}); // DB.init
</script>
</body>
</html>
