<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ผลตรวจทั้งหมด — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:20px">
    <div>
      <h1 id="page-title"></h1>
      <div class="muted small" id="meta"></div>
    </div>
    <input class="input" id="search" style="max-width:320px" />
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal').classList.remove('show')">✕</button>
    </div>
    <div class="modal-body" id="detail"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (!requireAdmin()) {} else {
  document.getElementById('chrome').innerHTML = renderTopbar('tests');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';

  document.getElementById('page-title').textContent = isEN ? 'All Test Results' : 'ผลตรวจทั้งหมด';
  document.getElementById('search').placeholder = isEN ? 'Search name / license plate / company' : 'ค้นหาชื่อ / ทะเบียน / บริษัท';
  document.getElementById('modal-title').textContent = isEN ? 'Test Result Details' : 'รายละเอียดผลตรวจ';
  document.getElementById('table-head').innerHTML = `
    <th>${isEN ? 'Date' : 'วันที่'}</th>
    <th>${isEN ? 'Name' : 'ชื่อ'}</th>
    <th>${isEN ? 'Department' : 'แผนก'}</th>
    <th>${isEN ? 'Location' : 'สถานที่'}</th>
    <th>${isEN ? 'Company' : 'บริษัท'}</th>
    <th>${isEN ? 'Result' : 'ผล'}</th>
    <th></th>
  `;

  const search = document.getElementById('search');
  function render() {
    const q = search.value.toLowerCase().trim();
    const tests = DB.tests().filter(t => !q || (t.full_name + t.plate_number + t.company + t.location_name).toLowerCase().includes(q));
    document.getElementById('meta').textContent = `${tests.length} ${isEN ? 'records' : 'รายการ'}`;
    document.getElementById('rows').innerHTML = tests.length ? tests.map(t => `
      <tr>
        <td class="small">${formatDateShort(t.created_at)}</td>
        <td><div style="font-weight:600">${t.full_name}</div>${t.plate_number ? `<div class="tiny muted">${isEN ? 'License Plate' : 'ทะเบียน'} ${t.plate_number}</div>` : ''}</td>
        <td class="small">${t.department}</td>
        <td class="small"><span style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted)">${t.location_code}</span> ${t.location_name}</td>
        <td class="small">${t.company}</td>
        <td>${t.is_zero ? '<span class="badge badge-success">0%</span>' : `<span class="badge badge-danger">${t.alcohol_value} mg%</span>`}</td>
        <td style="text-align:right">
          <button class="btn btn-sm" onclick="viewDetail('${t.id}')">${isEN ? 'View' : 'ดู'}</button>
          <button class="btn btn-sm btn-danger" onclick="del('${t.id}')">${isEN ? 'Delete' : 'ลบ'}</button>
        </td>
      </tr>
    `).join('') : `<tr><td colspan="7"><div class="empty"><div class="icon">📋</div>${isEN ? 'No data found' : 'ยังไม่มีข้อมูล'}</div></td></tr>`;
  }
  function viewDetail(id) {
    const t = DB.tests().find(x => x.id === id);
    if (!t) return;
    const shift = SHIFTS.find(s => s.id === t.shift_id);
    const actionMap = {
      'sent-home': isEN ? 'Sent Home' : 'ส่งกลับบ้าน',
      'suspended': isEN ? 'Suspended' : 'พักงาน',
      'allowed': isEN ? 'Allowed' : 'อนุญาต',
      'pending': isEN ? 'Pending' : 'รอดำเนินการ'
    };
    document.getElementById('detail').innerHTML = `
      <div class="col gap-md">
        <div class="row between"><span class="muted small">${isEN ? 'Name' : 'ชื่อ'}</span><span style="font-weight:600">${t.full_name}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Employee ID' : 'รหัสพนักงาน'}</span><span style="font-family:var(--font-mono);font-size:13px">${t.employee_id || '—'}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Department' : 'แผนก'}</span><span>${t.department}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Company' : 'บริษัท'}</span><span>${t.company}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'License Plate' : 'ทะเบียนรถ'}</span><span>${t.plate_number || '—'}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Location' : 'สถานที่'}</span><span>${t.location_name} (${t.location_code})</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Time' : 'เวลา'}</span><span>${formatDate(t.created_at)}</span></div>
        ${shift && DB.settings().shifts_enabled !== false ? `<div class="row between"><span class="muted small">${isEN ? 'Shift' : 'กะ'}</span><span>${shift.icon} ${shift.label}</span></div>` : ''}
        ${t.device_serial ? `<div class="row between"><span class="muted small">${isEN ? 'Device' : 'เครื่องตรวจ'}</span><span style="font-family:var(--font-mono);font-size:13px">${t.device_serial}</span></div>` : ''}
        <div class="row between"><span class="muted small">${isEN ? 'Test Result' : 'ผลตรวจ'}</span>${thresholdBadge(t)}</div>
        ${!t.is_zero && t.action_taken ? `<div class="row between"><span class="muted small">${isEN ? 'Action Taken' : 'การดำเนินการ'}</span><span class="action-chip action-${t.action_taken}">${actionMap[t.action_taken] || t.action_taken}</span></div>` : ''}
        ${t.action_note ? `<div class="row between"><span class="muted small">${isEN ? 'Notes' : 'หมายเหตุ'}</span><span class="small">${t.action_note}</span></div>` : ''}
        ${t.retest_of ? `<div class="row between"><span class="muted small">${isEN ? 'Type' : 'ประเภท'}</span><span class="badge badge-warn">${isEN ? 'Re-test' : 'ตรวจซ้ำ'}</span></div>` : ''}
        <div class="divider"></div>
        <div class="muted small">${isEN ? 'Device Photo' : 'ภาพถ่ายเครื่องตรวจ'}</div>
        <div style="background:var(--surface-2); border-radius:var(--r-md); aspect-ratio:4/3; display:grid; place-items:center; overflow:hidden">
          ${t.photo_url ? `<img src="${t.photo_url}" style="width:100%; height:100%; object-fit:cover">` : `<div class="muted small">${isEN ? '— No photo —' : '— ไม่มีรูปภาพ —'}</div>`}
        </div>
      </div>
    `;
    document.getElementById('modal').classList.add('show');
  }
  function del(id) {
    if (!confirm(isEN ? 'Confirm delete this record?' : 'ยืนยันการลบรายการนี้?')) return;
    DB.deleteTest(id);
    showToast(isEN ? 'Deleted' : 'ลบเรียบร้อย');
    render();
  }
  search.addEventListener('input', render);
  window.viewDetail = viewDetail; window.del = del;
  render();
  // Auto-open a specific test if URL contains ?open=id
  const openId = new URLSearchParams(location.search).get('open');
  if (openId) {
    const t = DB.tests().find(x => x.id === openId);
    if (t) { search.value = t.full_name; render(); viewDetail(openId); }
  }
}
}); // DB.init
</script>
</body>
</html>
