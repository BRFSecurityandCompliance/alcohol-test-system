<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<script>(function(){if(!/\.github\.io$/i.test(location.hostname))return;var f=(location.pathname.match(/\/project\/(.*)$/)||["",""])[1];location.replace("https://alcohol-test-system.securitycompliance.workers.dev/"+f+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ผลตรวจทั้งหมด — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:20px">
    <div>
      <h1 id="page-title"></h1>
      <div class="muted small" id="meta"></div>
    </div>
    <input class="input" id="search" style="max-width:320px" />
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal').classList.remove('show')">✕</button>
    </div>
    <div class="modal-body" id="detail"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (requireAdmin()) {
  document.getElementById('chrome').innerHTML = renderTopbar('tests');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';

  document.getElementById('page-title').textContent = isEN ? 'All Test Results' : 'ผลตรวจทั้งหมด';
  document.getElementById('search').placeholder = isEN ? 'Search name / license plate / company' : 'ค้นหาชื่อ / ทะเบียน / บริษัท';
  document.getElementById('modal-title').textContent = isEN ? 'Test Result Details' : 'รายละเอียดผลตรวจ';
  document.getElementById('table-head').innerHTML = `
    <th>${isEN ? 'Date' : 'วันที่'}</th>
    <th>${isEN ? 'Name' : 'ชื่อ'}</th>
    <th>${isEN ? 'Department' : 'แผนก'}</th>
    <th>${isEN ? 'Location' : 'สถานที่'}</th>
    <th>${isEN ? 'Company' : 'บริษัท'}</th>
    <th>${isEN ? 'Result' : 'ผล'}</th>
    <th></th>
  `;

  const canEdit = canEditTest();
  const search = document.getElementById('search');
  function render() {
    const q = search.value.toLowerCase().trim();
    const tests = DB.tests()
      .filter(t => canViewSite(t.location_code))
      .filter(t => !q || (t.full_name + t.plate_number + t.company + t.location_name).toLowerCase().includes(q));
    document.getElementById('meta').textContent = `${tests.length} ${isEN ? 'records' : 'รายการ'}`;
    document.getElementById('rows').innerHTML = tests.length ? tests.map(t => `
      <tr>
        <td class="small">${formatDateShort(t.created_at)}</td>
        <td><div style="font-weight:600">${esc(t.full_name)}</div>${t.plate_number ? `<div class="tiny muted">${isEN ? 'License Plate' : 'ทะเบียน'} ${esc(t.plate_number)}</div>` : ''}</td>
        <td class="small">${esc(t.department)}</td>
        <td class="small"><span style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted)">${esc(t.location_code)}</span> ${esc(t.location_name)}</td>
        <td class="small">${esc(t.company)}</td>
        <td>${t.is_zero ? '<span class="badge badge-success">0%</span>' : `<span class="badge badge-danger">${t.alcohol_value} mg%</span>`}</td>
        <td style="text-align:right">
          <button class="btn btn-sm" onclick="viewDetail('${t.id}')">${isEN ? 'View' : 'ดู'}</button>
          ${canEdit ? `<button class="btn btn-sm btn-danger" onclick="del('${t.id}')">${isEN ? 'Delete' : 'ลบ'}</button>` : ''}
        </td>
      </tr>
    `).join('') : `<tr><td colspan="7"><div class="empty"><div class="icon">📋</div>${isEN ? 'No data found' : 'ยังไม่มีข้อมูล'}</div></td></tr>`;
  }
  function viewDetail(id) {
    const t = DB.tests().find(x => x.id === id);
    if (!t) return;
    const orig = t.retest_of ? DB.tests().find(x => x.id === t.retest_of) : null;
    const actionMap = {
      'sent-home': isEN ? 'Sent Home' : 'ส่งกลับบ้าน',
      'suspended': isEN ? 'Suspended' : 'พักงาน',
      'allowed': isEN ? 'Allowed' : 'อนุญาต',
      'pending': isEN ? 'Pending' : 'รอดำเนินการ'
    };

    const testBlock = (tx, label) => {
      const shift = SHIFTS.find(s => s.id === tx.shift_id);
      return `
        ${label ? `<div style="font-weight:700;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">${label}</div>` : ''}
        <div class="row between"><span class="muted small">${isEN ? 'Time' : 'เวลา'}</span><span>${formatDate(tx.created_at)}</span></div>
        ${shift && DB.settings().shifts_enabled !== false ? `<div class="row between"><span class="muted small">${isEN ? 'Shift' : 'กะ'}</span><span>${shift.icon} ${shift.label}</span></div>` : ''}
        ${tx.device_serial ? `<div class="row between"><span class="muted small">${isEN ? 'Device' : 'เครื่องตรวจ'}</span><span style="font-family:var(--font-mono);font-size:13px">${esc(tx.device_serial)}</span></div>` : ''}
        <div class="row between"><span class="muted small">${isEN ? 'Test Result' : 'ผลตรวจ'}</span>${thresholdBadge(tx)}</div>
        ${!tx.is_zero && tx.action_taken ? `<div class="row between"><span class="muted small">${isEN ? 'Action Taken' : 'การดำเนินการ'}</span><span class="action-chip action-${tx.action_taken}">${actionMap[tx.action_taken] || tx.action_taken}</span></div>` : ''}
        ${tx.action_note ? `<div class="row between"><span class="muted small">${isEN ? 'Notes' : 'หมายเหตุ'}</span><span class="small">${esc(tx.action_note)}</span></div>` : ''}
        <div class="muted small" style="margin-top:8px">${isEN ? 'Device Photo' : 'ภาพถ่ายเครื่องตรวจ'}</div>
        <div style="background:var(--surface-2);border-radius:var(--r-md);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden">
          ${tx.photo_url ? `<img src="${tx.photo_url}" style="width:100%;height:100%;object-fit:cover">` : `<div class="muted small">${isEN ? '— No photo —' : '— ไม่มีรูปภาพ —'}</div>`}
        </div>`;
    };

    document.getElementById('detail').innerHTML = `
      <div class="col gap-md">
        <div class="row between"><span class="muted small">${isEN ? 'Name' : 'ชื่อ'}</span><span style="font-weight:600">${esc(t.full_name)}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Employee ID' : 'รหัสพนักงาน'}</span><span style="font-family:var(--font-mono);font-size:13px">${esc(t.employee_id) || '—'}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Department' : 'แผนก'}</span><span>${esc(t.department)}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Company' : 'บริษัท'}</span><span>${esc(t.company)}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'License Plate' : 'ทะเบียนรถ'}</span><span>${esc(t.plate_number) || '—'}</span></div>
        <div class="row between"><span class="muted small">${isEN ? 'Location' : 'สถานที่'}</span><span>${esc(t.location_name)} (${esc(t.location_code)})</span></div>
        <div class="divider"></div>
        ${orig ? `
          ${testBlock(orig, isEN ? 'Test 1 / ครั้งที่ 1' : 'ครั้งที่ 1 / Test 1')}
          <div class="divider"></div>
          ${testBlock(t, isEN ? 'Test 2 — Retest / ครั้งที่ 2 (ตรวจซ้ำ)' : 'ครั้งที่ 2 — ตรวจซ้ำ / Retest')}
        ` : testBlock(t, '')}
      </div>
    `;
    document.getElementById('modal').classList.add('show');
  }
  function del(id) {
    if (!canEdit) return;
    if (!confirm(isEN ? 'Confirm delete this record?' : 'ยืนยันการลบรายการนี้?')) return;
    DB.deleteTest(id);
    showToast(isEN ? 'Deleted' : 'ลบเรียบร้อย');
    render();
  }
  search.addEventListener('input', render);
  window.viewDetail = viewDetail; window.del = del;
  render();
  DB.startPolling(render, 5000);
  // Auto-open a specific test if URL contains ?open=id
  const openId = new URLSearchParams(location.search).get('open');
  if (openId) {
    const t = DB.tests().find(x => x.id === openId);
    if (t) { search.value = t.full_name; render(); viewDetail(openId); }
  }
}
}); // DB.init
</script>
</body>
</html>
