<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- Self-contained, text-free, fixed geometry: renders identically on every
       device/OS/browser that supports SVG icons. Content sits inside a safe
       zone so it survives circular / rounded icon masking. -->
  <defs>
    <linearGradient id="atsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5be0"/>
      <stop offset="1" stop-color="#1c327d"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#atsBg)"/>
  <!-- shield -->
  <path d="M16 4.2l9 3.35v6.6c0 5.65-3.83 10.5-9 12.05C10.83 24.65 7 19.8 7 14.15V7.55L16 4.2z" fill="#ffffff"/>
  <!-- check -->
  <path d="M11.4 15.9l3.3 3.3 6.1-6.5" fill="none" stroke="#2f5be0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
