<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<script>(function(){if(!/\.github\.io$/i.test(location.hostname))return;var f=(location.pathname.match(/\/project\/(.*)$/)||["",""])[1];location.replace("https://alcohol-test-system.securitycompliance.workers.dev/"+f+location.search+location.hash);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ส่งข้อมูลสำเร็จ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="alternate icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: var(--surface-2); }
  .check { width: 96px; height: 96px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: grid; place-items: center; font-size: 48px; margin: 0 auto 24px; animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .container { max-width: 480px; margin: 0 auto; padding: 60px 20px 24px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <div class="check">✓</div>
  <h1 style="margin-bottom:8px">ส่งข้อมูลเรียบร้อย</h1>
  <p class="muted" style="margin:0 0 28px">ข้อมูลผลตรวจของคุณถูกบันทึกในระบบแล้ว ขอบคุณที่ให้ความร่วมมือ</p>

  <div class="card" style="text-align:left; margin-bottom:16px" id="summary"></div>

  <a href="#" id="again" class="btn btn-primary btn-block btn-lg">บันทึกผลถัดไป</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
const lang = localStorage.getItem('lang') || 'th';
const T = (k) => t(k, lang);
const isEN = lang === 'en';
const params = new URLSearchParams(location.search);
const code = params.get('location');
const isZero = params.get('zero') === 'true';
const isOffline = params.get('offline') === '1';
const loc = code ? DB.findLocation(code) : null;
const summary = document.getElementById('summary');
const again = document.getElementById('again');

// Update static text with language
document.title = isEN ? 'Submitted Successfully' : 'ส่งข้อมูลสำเร็จ';
document.querySelector('h1').textContent = isEN ? 'Submitted Successfully' : 'ส่งข้อมูลเรียบร้อย';
document.querySelector('p.muted').textContent = isEN ? 'Your test result has been recorded. Thank you for your cooperation.' : 'ข้อมูลผลตรวจของคุณถูกบันทึกในระบบแล้ว ขอบคุณที่ให้ความร่วมมือ';
document.getElementById('again').textContent = isEN ? 'Next person' : 'บันทึกผลถัดไป';

// Find the most recent test from this location (just submitted)
const recentTest = DB.tests().find(t => t.location_code === code);

if (loc) {
  const recordedTime = recentTest?.created_at
    ? new Date(recentTest.created_at).toLocaleString(isEN ? 'en-GB' : 'th-TH', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short', year:'numeric'})
    : new Date().toLocaleString(isEN ? 'en-GB' : 'th-TH', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short', year:'numeric'});

  summary.innerHTML = `
    ${recentTest?.full_name ? `<div class="row between" style="margin-bottom:12px">
      <span class="muted small">${isEN ? 'Name' : 'ชื่อ'}</span>
      <span style="font-weight:600">${recentTest.full_name}</span>
    </div>` : ''}
    ${recentTest?.department ? `<div class="row between" style="margin-bottom:12px">
      <span class="muted small">${isEN ? 'Department' : 'แผนก'}</span>
      <span class="small">${recentTest.department}</span>
    </div>` : ''}
    <div class="row between" style="margin-bottom:12px">
      <span class="muted small">${isEN ? 'Location' : 'สถานที่'}</span>
      <span style="font-weight:600">${loc.name}</span>
    </div>
    <div class="row between" style="margin-bottom:12px">
      <span class="muted small">${isEN ? 'Time recorded' : 'เวลาที่บันทึก'}</span>
      <span>${recordedTime}</span>
    </div>
    <div class="row between">
      <span class="muted small">${isEN ? 'Result' : 'ผล'}</span>
      ${isZero
        ? `<span class="badge badge-success"><span class="badge-dot"></span>${T('no_alcohol')}</span>`
        : `<span class="badge badge-danger"><span class="badge-dot"></span>${T('has_alcohol')} ${recentTest?.alcohol_value ? `(${recentTest.alcohol_value} mg%)` : ''}</span>`}
    </div>
  `;
  if (isOffline) {
    const banner = document.createElement('div');
    banner.className = 'card';
    banner.style.cssText = 'background:#fef3c7; border-color:#f59e0b; margin-bottom:16px; display:flex; gap:10px; align-items:center; text-align:left';
    banner.innerHTML = `<span style="font-size:20px">⚡</span><div class="small" style="color:#92400e"><b>${isEN ? 'Saved offline' : 'บันทึกแบบออฟไลน์'}</b> — ${isEN ? 'Data will be synced when back online.' : 'ข้อมูลจะถูกส่งไปยังระบบเมื่อกลับมาออนไลน์'}</div>`;
    summary.parentNode.insertBefore(banner, summary);
  }
  again.href = `user-form.html?location=${code}`;
} else {
  summary.innerHTML = `<div class="muted">${isEN ? 'Location not found' : 'ไม่พบข้อมูลสถานที่'}</div>`;
  again.style.display = 'none';
}
}); // DB.init
</script>
</body>
</html>
