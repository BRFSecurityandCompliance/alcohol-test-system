<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audit Log — แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  .action-tag { display:inline-flex; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; font-family:var(--font-mono); letter-spacing:.03em; }
  .act-delete { background:#fee2e2; color:#7f1d1d; }
  .act-update { background:#dbeafe; color:#1e3a8a; }
  .act-add { background:#dcfce7; color:#14532d; }
  .act-login { background:#f3e8ff; color:#4c1d95; }
  .act-other { background:var(--surface-2); color:var(--text-muted); }
</style>
</head>
<body>
<div id="chrome"></div>
<div class="page">
  <div class="row between" style="margin-bottom:24px">
    <div>
      <h1>Audit Log</h1>
      <div class="muted small" id="page-sub"></div>
    </div>
    <button class="btn" onclick="exportAudit()">📥 Export CSV</button>
  </div>

  <div class="banner banner-info" style="margin-bottom:20px">
    <span class="banner-icon">🔒</span>
    <div class="small" id="banner-text"></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px">
      <div class="field">
        <label id="lbl-search"></label>
        <input class="input" id="search" id="search-input" oninput="render()" />
      </div>
      <div class="field">
        <label id="lbl-action-type"></label>
        <select class="select" id="f-action" onchange="render()">
          <option value="" id="opt-all"></option>
          <option value="delete" id="opt-delete"></option>
          <option value="update" id="opt-update"></option>
          <option value="add" id="opt-add"></option>
        </select>
      </div>
      <div class="field">
        <label id="lbl-from"></label>
        <input class="input" type="date" id="f-from" onchange="render()" />
      </div>
      <div class="field">
        <label id="lbl-to"></label>
        <input class="input" type="date" id="f-to" onchange="render()" />
      </div>
    </div>
  </div>

  <div class="row between" style="margin-bottom:12px">
    <span class="muted small" id="count"></span>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr id="table-head">
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="data.js"></script>
<script>
DB.init().then(() => {
if (!requireAdmin() || !hasRole('super', 'auditor')) { location.href = 'admin-dashboard.html'; } else {
  document.getElementById('chrome').innerHTML = renderTopbar('audit');
  const isEN = (localStorage.getItem('lang')||'th') === 'en';

  document.getElementById('page-sub').textContent = isEN ? 'All system activity log (read-only)' : 'บันทึกการดำเนินการทั้งหมดในระบบ (อ่านอย่างเดียว)';
  document.getElementById('banner-text').textContent = isEN
    ? 'Audit log records all important changes — cannot be edited or deleted. Used for verification and compliance.'
    : 'Audit log บันทึกทุกการแก้ไขที่สำคัญ — ไม่สามารถแก้ไขหรือลบได้ ใช้เพื่อตรวจสอบความถูกต้องและ compliance';
  document.getElementById('lbl-search').textContent = isEN ? 'Search' : 'ค้นหา';
  document.getElementById('search').placeholder = isEN ? 'Name / action / detail' : 'ชื่อ / action / รายละเอียด';
  document.getElementById('lbl-action-type').textContent = isEN ? 'Action Type' : 'ประเภท Action';
  document.getElementById('opt-all').textContent = isEN ? 'All' : 'ทั้งหมด';
  document.getElementById('opt-delete').textContent = isEN ? 'Delete' : 'ลบ (delete)';
  document.getElementById('opt-update').textContent = isEN ? 'Update' : 'แก้ไข (update)';
  document.getElementById('opt-add').textContent = isEN ? 'Add' : 'เพิ่ม (add)';
  document.getElementById('lbl-from').textContent = isEN ? 'Start Date' : 'วันที่เริ่ม';
  document.getElementById('lbl-to').textContent = isEN ? 'End Date' : 'วันที่สิ้นสุด';
  document.getElementById('table-head').innerHTML = `
    <th>${isEN ? 'Time' : 'เวลา'}</th>
    <th>${isEN ? 'Actor' : 'ผู้ดำเนินการ'}</th>
    <th>Action</th>
    <th>${isEN ? 'Target' : 'เป้าหมาย'}</th>
    <th>${isEN ? 'Detail' : 'รายละเอียด'}</th>
  `;

  function actionTag(action) {
    const cls = action.startsWith('delete') ? 'act-delete' :
                action.startsWith('update') ? 'act-update' :
                action.startsWith('add') || action.startsWith('create') ? 'act-add' :
                action.includes('login') ? 'act-login' : 'act-other';
    return `<span class="action-tag ${cls}">${action}</span>`;
  }

  function filtered() {
    const q = document.getElementById('search').value.toLowerCase();
    const fa = document.getElementById('f-action').value;
    const from = document.getElementById('f-from').value;
    const to = document.getElementById('f-to').value;
    return DB.audit().filter(a => {
      if (q && !(a.actor_name + a.action + a.detail + a.target).toLowerCase().includes(q)) return false;
      if (fa && !a.action.includes(fa)) return false;
      const d = new Date(a.created_at);
      if (from && d < new Date(from)) return false;
      if (to) { const e = new Date(to); e.setHours(23,59,59); if (d > e) return false; }
      return true;
    });
  }

  function render() {
    const entries = filtered();
    document.getElementById('count').textContent = `${entries.length} ${isEN ? 'records' : 'รายการ'}`;
    document.getElementById('rows').innerHTML = entries.length ? entries.map(a => `
      <tr>
        <td class="small" style="font-family:var(--font-mono); white-space:nowrap">${formatDate(a.created_at)}</td>
        <td>
          <div class="row gap-sm">
            <div class="avatar-sm">${(a.actor_name||'?').charAt(0)}</div>
            <div>
              <div style="font-weight:600; font-size:14px">${a.actor_name || a.actor_id || '?'}</div>
            </div>
          </div>
        </td>
        <td>${actionTag(a.action)}</td>
        <td class="small" style="font-family:var(--font-mono); color:var(--text-muted)">${a.target || '—'}</td>
        <td class="small">${a.detail || '—'}</td>
      </tr>
    `).join('') : `<tr><td colspan="5"><div class="empty"><div class="icon">📋</div>${isEN ? 'No data found' : 'ไม่พบข้อมูล'}</div></td></tr>`;
  }

  function exportAudit() {
    const entries = filtered();
    const headers = isEN ? ['Time','Actor','Action','Target','Detail'] : ['เวลา','ผู้ดำเนินการ','Action','เป้าหมาย','รายละเอียด'];
    const rows = entries.map(a => [formatDate(a.created_at), a.actor_name || a.actor_id, a.action, a.target || '', a.detail || '']);
    const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `audit-log-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    showToast(isEN ? 'CSV exported' : 'Export CSV เรียบร้อย');
  }

  window.render = render;
  window.exportAudit = exportAudit;
  render();
  DB.startPolling(render, 5000);
}
}); // DB.init
</script>
</body>
</html>
