<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เข้าสู่ระบบแอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: linear-gradient(135deg, #1f3a8a 0%, #2851d6 100%); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { max-width: 400px; width: 100%; }
  .logo-big { width: 56px; height: 56px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 24px; margin: 0 auto 16px; }
</style>
</head>
<body>
<div class="card login-card">
  <div class="logo-big">A</div>
  <h1 style="text-align:center; margin-bottom:6px; font-size:22px">เข้าสู่ระบบแอดมิน</h1>
  <p class="muted small" style="text-align:center; margin:0 0 24px">ระบบตรวจแอลกอฮอล์</p>

  <form id="form" class="col gap-md">
    <div class="field">
      <label>อีเมล</label>
      <input class="input" type="email" name="email" required autofocus value="admin@alcohol-test.local" />
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input class="input" type="password" name="password" required />
    </div>
    <div id="err" class="small" style="color:var(--danger); display:none">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
    <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">เข้าสู่ระบบ</button>
  </form>

  <div class="divider"></div>
  <a href="index.html" class="btn btn-ghost btn-block">← กลับหน้าหลัก</a>
</div>

<script src="data.js"></script>
<script>
__dbReady.then(() => {
const form = document.getElementById('form');
const errEl = document.getElementById('err');
const btn = document.getElementById('submit-btn');
form.addEventListener('submit', async e => {
  e.preventDefault();
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const r = await fetch(_SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': _SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value })
    });
    if (!r.ok) throw new Error('invalid');
    const { access_token } = await r.json();
    sessionStorage.setItem('sb_token', access_token);
    setAdminAuth(true);
    location.href = 'admin-dashboard.html';
  } catch {
    errEl.style.display = 'block';
    form.password.value = '';
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
});
});
</script>
</body>
</html>
