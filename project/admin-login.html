<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เข้าสู่ระบบแอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: linear-gradient(135deg, #1f3a8a 0%, #2851d6 100%); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { max-width: 400px; width: 100%; }
  .logo-big { width: 56px; height: 56px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 24px; margin: 0 auto 16px; }
</style>
</head>
<body>
<div class="card login-card">
  <div class="logo-big">A</div>
  <h1 style="text-align:center; margin-bottom:6px; font-size:22px">เข้าสู่ระบบแอดมิน</h1>
  <p class="muted small" style="text-align:center; margin:0 0 24px">ระบบตรวจแอลกอฮอล์</p>

  <form id="form" class="col gap-md">
    <div class="field">
      <label>รหัสผ่าน</label>
      <input class="input" type="password" name="password" required autofocus />
      <div class="hint">รหัสตัวอย่าง: <code style="font-family:var(--font-mono)">admin1234</code></div>
    </div>
    <div id="err" class="small" style="color:var(--danger); display:none">รหัสผ่านไม่ถูกต้อง</div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">เข้าสู่ระบบ</button>
  </form>

  <div class="divider"></div>
  <a href="index.html" class="btn btn-ghost btn-block">← กลับหน้าหลัก</a>
</div>

<script src="data.js"></script>
<script>
__dbReady.then(() => {
document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const pw = e.target.password.value;
  if (pw === ADMIN_PASSWORD) {
    setAdminAuth(true);
    location.href = 'admin-dashboard.html';
  } else {
    document.getElementById('err').style.display = 'block';
    e.target.password.value = '';
  }
});
});
</script>
</body>
</html>
